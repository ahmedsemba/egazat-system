<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إدارة رصيد الإجازات - البروي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}input{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}button{padding:11px;border-radius:9px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px 0;width:100%}.btn-blue{background:#6366f1}.btn-green{background:#10b981}.alert-green{background:#065f46;border:1px solid #10b981;padding:9px;border-radius:9px;margin:7px 0}.alert-blue{background:#1e3a8a;border:1px solid #6366f1;padding:9px;border-radius:9px;margin:7px 0}.balance-big{font-size:44px;font-weight:900;color:#10b981;text-align:center}</style></head><body>
<div style="background:linear-gradient(135deg,#0f172a,#4f46e5);padding:16px;text-align:center;border-bottom:3px solid #10b981"><h3 style="margin:0">🏭 إدارة رصيد الإجازات</h3><small style="opacity:0.9">شركة البروي لصناعة الغازات - مصنع العبور</small></div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981"><input id="empCodeOnly" type="tel" placeholder="اكتب كودك" style="text-align:center;font-size:22px;font-weight:900"><button onclick="searchByCode()">🔍 عرض رصيدي</button><div id="empResult"></div></div>
<div class="card" id="dataStatus"></div>
<div class="card"><b>🔐 إدارة</b><input id="adminPass" type="password" placeholder="••••••••" autocomplete="off"><button class="btn-blue" onclick="login()">دخول</button>
<div id="configArea" style="display:none;background:#0f172a;padding:10px;border-radius:10px;margin-top:10px;border:1px dashed #334155">
<small>إعداد أول مرة فقط</small>
<input id="ghToken" type="password" placeholder="••••••••" autocomplete="off">
<button class="btn-blue" onclick="saveToken()">💾 حفظ وإخفاء</button>
<div id="tokenStatus"></div>
</div>
<div id="adminArea" style="display:none;margin-top:10px">
<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)">
<button class="btn-blue" onclick="document.getElementById('excelFile').click()">اختر الشيت</button>
<button class="btn-green" onclick="uploadToGitHub()">☁️ رفع على GitHub</button>
<div id="uploadStatus"></div>
</div></div>
</div>
<script>
let employees=[],hasData=false;
function getGH(){ return {user:'ahmedsemba', repo:'egazat-system', token:localStorage.getItem('gh_token')||''} }
function saveToken(){ let t=document.getElementById('ghToken').value.trim(); if(!t){alert('حط التوكن');return;} localStorage.setItem('gh_token',t); document.getElementById('tokenStatus').innerHTML='<div class="alert-green">✅ اتحفظ</div>'; setTimeout(()=>{ document.getElementById('configArea').style.display='none'; document.getElementById('ghToken').value=''; },800); }
function login(){ let p=document.getElementById('adminPass').value; const K=[65,104,109,101,100,64,115,97,108,119,97,50,48,50,48]; let ok=p.length===K.length; if(ok) for(let i=0;i<K.length;i++) if(p.charCodeAt(i)!==K[i]) ok=false; if(!ok){alert('الباسورد غلط');return;} let hasToken=localStorage.getItem('gh_token'); if(!hasToken){ document.getElementById('configArea').style.display='block'; document.getElementById('adminArea').style.display='none'; return; } document.getElementById('configArea').style.display='none'; document.getElementById('adminArea').style.display='block'; loadFromGitHub(); }
function parseWorkbook(wb){ let emps=[]; wb.SheetNames.forEach(sn=>{ let ws=wb.Sheets[sn]; let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}); for(let r=1;r<rows.length;r++){ let row=rows[r]; if(!row||row[0]==null) continue; let code=parseInt(row[0]); if(isNaN(code)) continue; let name=row[1], dept=row[2], type=row[3], bal=row[5]; if(!name) continue; let b=0; if(bal!=null){ let v=parseFloat(bal); if(!isNaN(v)) b=v; } emps.push({code:code,name:String(name).trim(),dept:String(dept||'').trim(),type:String(type||'مقيم').trim(),balance:b}); } }); employees=emps; hasData=true; document.getElementById('uploadStatus').innerHTML=`<div class="alert-green">✅ ${emps.length} موظف جاهز - دوس رفع</div>`; }
function handleExcel(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(evt){ let d=new Uint8Array(evt.target.result); let wb=XLSX.read(d,{type:'array'}); parseWorkbook(wb); }; r.readAsArrayBuffer(f); }
async function loadFromGitHub(){ let {user,repo}=getGH(); document.getElementById('dataStatus').innerHTML='<div class="alert-blue">⏳ تحميل...</div>'; try{ let res=await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/data.json?${Date.now()}`,{cache:'no-store'}); let txt=await res.text(); if(!res.ok||!txt||txt.trim()=='[]'||txt.trim()==''){ document.getElementById('dataStatus').innerHTML='<div class="alert-blue">السحابة فاضية</div>'; return; } let data=JSON.parse(txt); employees=Array.isArray(data)?data:[]; hasData=employees.length>0; if(hasData){ document.getElementById('dataStatus').innerHTML=`<div class="alert-green">✅ ${employees.length} موظف محمل</div>`; } }catch(e){} }
async function uploadToGitHub(){ if(!hasData){alert('اختر الشيت');return;} let {user,repo,token}=getGH(); if(!token){alert('حط التوكن');return;} document.getElementById('uploadStatus').innerHTML='<div class="alert-blue">⏳ بيرفع...</div>'; try{ let getRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`}}); let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; } let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees)))); let putRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`تحديث رصيد`,content:content,sha:sha})}); if(putRes.ok){ document.getElementById('uploadStatus').innerHTML=`<div class="alert-green">✅ اترفع!</div>`; setTimeout(loadFromGitHub,2000); } }catch(e){} }
function searchByCode(){ let c=document.getElementById('empCodeOnly').value.trim(); let emp=employees.find(e=>String(e.code)===c); document.getElementById('empResult').innerHTML=emp?`<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center"><b>${emp.code} - ${emp.name}</b><div class="balance-big">${emp.balance.toFixed(1)}</div></div>`:'❌ غير موجود'; }
setTimeout(loadFromGitHub,800);
</script></body></html>
