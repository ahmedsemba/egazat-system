<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الإجازات - تصدير مقيمين Excel</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{font-family:Cairo,sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#4f46e5);padding:18px;text-align:center;border-bottom:3px solid #10b981}
.card{background:#1e293b;margin:12px;padding:16px;border-radius:14px;border:1px solid #334155}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:6px 0}
button{padding:11px 18px;border-radius:10px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px}
.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}
.tabs{display:flex;gap:8px;justify-content:center;margin:12px}
.tab{padding:10px 20px;background:#334155;border-radius:20px;cursor:pointer;font-weight:700}
.tab.active{background:#10b981;color:#000}
.balance-big{font-size:48px;font-weight:900;color:#10b981;text-align:center}
.alert{padding:10px;border-radius:10px;margin:8px 0;font-size:12px}
.alert-green{background:#065f46;border:1px solid #10b981}
.alert-yellow{background:#78350f;border:1px solid #f59e0b}
.alert-blue{background:#1e3a8a;border:1px solid #6366f1}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#0f172a;border-radius:8px;overflow:hidden}
th,td{padding:6px;border:1px solid #334155;text-align:center;font-size:10px}
th{background:#334155}
.upload-area{border:2px dashed #10b981;padding:20px;border-radius:12px;text-align:center;background:#0f172a;margin:12px 0;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">🏭 نظام رصيد الإجازات - تصدير مقيمين Excel</h2></div>
<div class="tabs"><div class="tab active" id="btnEmp" onclick="switchTab('emp')">👤 موظف</div><div class="tab" id="btnAdmin" onclick="switchTab('admin')">🔐 إدارة</div></div>
<div id="tab-emp"><div class="card" style="text-align:center;border:2px solid #10b981"><input id="empCodeOnly" type="tel" placeholder="101" style="text-align:center;font-size:22px;font-weight:900"><button onclick="searchByCode()" style="width:100%">🔍 عرض رصيدي</button><div id="empResult"></div></div><div class="card" id="dataStatus"></div><div class="card" id="autoStatus"></div></div>
<div id="tab-admin" style="display:none"><div class="card"><h3>🔐 إدارة</h3><input id="adminPass" type="password" placeholder="كلمة السر"><button class="btn-blue" onclick="loginAdmin()">دخول</button><div id="adminContent" style="display:none">
<div class="upload-area" onclick="document.getElementById('excelFile').click()">📁 اختر data.xlsx<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)"></div>
<div id="uploadStatus"></div>
<button class="btn-blue" onclick="loadFromServer()" style="width:100%">🔄 تحميل من data.xlsx</button>
<button class="btn-orange" onclick="forceMonthlyUpdate()" style="width:100%;margin-top:8px">⚡ زيادة يوم 26 الآن</button>
<button class="btn-orange" onclick="handleAnnualReset()" style="width:100%;margin-top:8px;background:#f59e0b">📅 رصيد سنوي جديد 26 ديسمبر</button>
<hr>
<input id="adjCode" placeholder="كود"><input id="adjAmount" type="number" step="0.5" placeholder="+1 أو -1"><input id="adjReason" placeholder="السبب: تحويل إضافي"><button class="btn-orange" onclick="adjustBalance()" style="width:100%">✅ تطبيق تعديل يدوي</button>
<hr><input id="adminSearch" placeholder="بحث..." oninput="renderAdmin()"><div id="adminList"></div>
<button class="btn-blue" onclick="exportAllResidents()" style="background:#10b981;width:100%">📗 تصدير أرصدة المقيمين الحالية Excel</button>
<button class="btn-blue" onclick="exportOldBalances()" style="background:#f59e0b;color:#000;width:100%;margin-top:8px">💰 تصدير الأرصدة القديمة للمقيمين (فلوس) Excel</button>
</div></div></div>
<script>
function _0xCheck(p){ const _0xK=[65, 104, 109, 101, 100, 64, 115, 97, 108, 119, 97, 50, 48, 50, 48]; if(p.length!==_0xK.length) return false; for(let i=0;i<_0xK.length;i++) if(p.charCodeAt(i)!==_0xK[i]) return false; return true; }
let employees=[],adjustments={},hasData=false;
function loadStored(){ let s=localStorage.getItem('egazat_employees'); let a=localStorage.getItem('egazat_adjustments'); if(s){try{employees=JSON.parse(s);hasData=employees.length>0;}catch(e){}} if(a){try{adjustments=JSON.parse(a);}catch(e){}} updateStatus(); if(!hasData){loadFromServer().then(()=>{checkAnnualAndMonthly();});}else{checkAnnualAndMonthly();} }
function updateStatus(){ let d=document.getElementById('dataStatus'); if(hasData) d.innerHTML=`<div class="alert alert-green">✅ ${employees.length} موظف</div>`; }
function switchTab(t){ document.getElementById('tab-emp').style.display=t==='emp'?'block':'none'; document.getElementById('tab-admin').style.display=t==='admin'?'block':'none'; document.getElementById('btnEmp').classList.toggle('active',t==='emp'); document.getElementById('btnAdmin').classList.toggle('active',t==='admin'); if(t==='admin') renderAdmin(); }
function parseDate(v){ if(!v) return null; if(typeof v==='number'){return new Date((v-25569)*86400*1000);} let d=new Date(v); if(!isNaN(d)) return d; return null; }
function parseWorkbook(wb){ let emps={}; wb.SheetNames.forEach(sheetName=>{ let ws=wb.Sheets[sheetName]; let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}); for(let r=2;r<rows.length;r++){ let row=rows[r]; let code=row[0],name=row[1],dept=row[2],type=row[3],hire=row[4],balance=row[5]; if(code==null||name==null) continue; code=parseInt(code); if(isNaN(code)) continue; let typeStr='مغترب'; let hireVal=null,balVal=0; if(row[3]!=null){ let t=String(row[3]).trim(); if(t.includes('مغترب')||t.includes('مقيم')||t==='1'||t==='0'){typeStr=t; hireVal=row[4]; balVal=row[5];}else{typeStr='مغترب'; hireVal=row[3]; balVal=row[5]||row[4];} } if(String(typeStr)=='1') typeStr='مغترب'; if(String(typeStr)=='0') typeStr='مقيم'; if(!emps[code]){ let hd=parseDate(hireVal); let hireStr=hd?hd.toISOString().slice(0,10):'2000-01-01'; emps[code]={code:code,name:String(name).trim(),dept:String(dept||'').trim(),type:typeStr,hire:hireStr,balances:{},leaves_count:{}}; } let b=0; if(balVal!=null){ let s=String(balVal); if(s.includes('+')){let tot=0; s.split('+').forEach(p=>{let v=parseFloat(p); if(!isNaN(v)) tot+=v;}); b=tot;} else{let v=parseFloat(s); if(!isNaN(v)) b=v;} } emps[code].balances[sheetName]=b; } }); employees=Object.values(emps); hasData=true; localStorage.setItem('egazat_employees',JSON.stringify(employees)); updateStatus(); renderAdmin(); }
function handleExcel(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(evt){ try{let data=new Uint8Array(evt.target.result); let wb=XLSX.read(data,{type:'array'}); parseWorkbook(wb);}catch(err){} }; reader.readAsArrayBuffer(file); }
async function loadFromServer(){ for(let fname of ['data.xlsx','Data.xlsx']){ try{let res=await fetch('./'+fname); if(!res.ok) continue; let ab=await res.arrayBuffer(); let wb=XLSX.read(new Uint8Array(ab),{type:'array'}); parseWorkbook(wb); return;}catch(e){} } }
function getBaseBalance(emp){ let keys=Object.keys(emp.balances); if(keys.length>0) return emp.balances[keys[keys.length-1]]; return 0; }
function getTenureYears(hireStr){ return (new Date()-new Date(hireStr))/(1000*60*60*24*365.25); }
function getMonthlyAddition(emp, forDate){ let hire=new Date(emp.hire); let now=forDate||new Date(); let tenure=(now-hire)/(1000*60*60*24*365.25); let month=now.getMonth()+1; let isMog=String(emp.type).includes('مغترب'); let add=0; if(isMog){ let isFirst=hire.getMonth()===now.getMonth()&&hire.getFullYear()===now.getFullYear(); if(isFirst){let dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); let worked=dim-hire.getDate()+1; add=(worked/dim)*5; add=Math.round(add*2)/2;} else{add=5;} if(tenure>=10&&month>=1&&month<=9) add+=1; } else{ if(tenure<0.5) add=0; else if(tenure>=10&&month>=1&&month<=9) add=1; } return add; }
function checkMonthlyAuto(){ if(!hasData) return; let now=new Date(); let last=localStorage.getItem('last_auto_month'); let key=`${now.getFullYear()}-${now.getMonth()+1}`; if(now.getDate()<26) return; if(last===key) return; employees.forEach(emp=>{ let add=getMonthlyAddition(emp,now); if(add>0){ let code=String(emp.code); if(!adjustments[code]) adjustments[code]=[]; if(!adjustments[code].some(a=>a.reason.includes(key))){ adjustments[code].push({amount:add,reason:`زيادة شهرية ${key}`,date:now.toISOString().slice(0,10)}); } } }); localStorage.setItem('egazat_adjustments',JSON.stringify(adjustments)); localStorage.setItem('last_auto_month',key); }
function handleAnnualReset(){ let now=new Date(); let yearKey=now.getFullYear(); let oldBalances=JSON.parse(localStorage.getItem('old_balances_'+yearKey)||'{}'); let newYear=yearKey+1; employees.forEach(emp=>{ let isMog=String(emp.type).includes('مغترب'); if(!isMog){ let tenure=getTenureYears(emp.hire); let finalBal=getFinalBalance(emp); oldBalances[String(emp.code)]={name:emp.name,dept:emp.dept,type:emp.type,oldBalance:finalBal,hire:emp.hire,tenure:tenure.toFixed(1),date:now.toISOString().slice(0,10)}; let newAnnual=tenure>=10?30:21; let diff=newAnnual-finalBal; let code=String(emp.code); if(!adjustments[code]) adjustments[code]=[]; adjustments[code].push({amount:diff,reason:`رصيد سنوي جديد ${newYear} - ${newAnnual}`,date:now.toISOString().slice(0,10)}); } }); localStorage.setItem('old_balances_'+yearKey,JSON.stringify(oldBalances)); localStorage.setItem('egazat_adjustments',JSON.stringify(adjustments)); localStorage.setItem('last_annual_year',yearKey); alert('تم تطبيق الرصيد السنوي الجديد'); renderAdmin(); }
function exportOldBalances(){
  let keys=Object.keys(localStorage).filter(k=>k.startsWith('old_balances_'));
  if(keys.length==0){alert('لا يوجد أرصدة قديمة - طبق رصيد 26 ديسمبر أولا');return;}
  let lastKey=keys.sort().pop();
  let data=JSON.parse(localStorage.getItem(lastKey)||'{}');
  let rows=[];
  rows.push(["كود الموظف","اسم الموظف","النوع","الإدارة","المتبقي من الرصيد (قديم)","تاريخ التعيين","سنوات الخدمة","تاريخ الحفظ"]);
  for(let code in data){
    let d=data[code];
    rows.push([code,d.name,d.type,d.dept,d.oldBalance,d.hire,d.tenure,d.date]);
  }
  let ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:22},{wch:10},{wch:18},{wch:20},{wch:14},{wch:12},{wch:14}];
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"أرصدة قديمة - مقيمين فلوس");
  XLSX.writeFile(wb, `ارصدة_قديمة_مقيمين_فلوس_${lastKey}.xlsx`);
}
function exportAllResidents(){
  if(!hasData){alert('لا يوجد بيانات');return;}
  let residents=employees.filter(e=>!String(e.type).includes('مغترب'));
  if(residents.length==0) residents=employees.filter(e=>String(e.type).includes('مقيم'));
  let rows=[];
  rows.push(["كود الموظف","اسم الموظف","النوع","الإدارة","المتبقي من الرصيد","تاريخ التعيين","سنوات الخدمة"]);
  residents.forEach(emp=>{
    let finalBal=getFinalBalance(emp);
    let tenure=getTenureYears(emp.hire).toFixed(1);
    rows.push([emp.code,emp.name,emp.type,emp.dept,finalBal,emp.hire,tenure]);
  });
  let ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:22},{wch:10},{wch:18},{wch:16},{wch:14},{wch:12}];
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"أرصدة مقيمين حالية");
  XLSX.writeFile(wb, `ارصدة_مقيمين_حالية_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function checkAnnualAndMonthly(){ checkMonthlyAuto(); }
function forceMonthlyUpdate(){ localStorage.removeItem('last_auto_month'); checkMonthlyAuto(); alert('تمت الزيادة'); renderAdmin(); }
function getFinalBalance(emp){ let base=getBaseBalance(emp); let adj=(adjustments[String(emp.code)]||[]).reduce((s,a)=>s+parseFloat(a.amount||0),0); return base+adj; }
function searchByCode(){ let code=document.getElementById('empCodeOnly').value.trim(); let out=document.getElementById('empResult'); let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){out.innerHTML='❌ الكود غير موجود';return;} let finalBal=getFinalBalance(emp); out.innerHTML=`<div class="card" style="border:2px solid #10b981"><b>${emp.code} - ${emp.name}</b><br><small>${emp.dept} | ${emp.type}</small><div class="balance-big">${finalBal.toFixed(1)}</div></div>`; }
function loginAdmin(){ let p=document.getElementById('adminPass').value; if(!_0xCheck(p)){alert('كلمة السر غير صحيحة');return;} document.getElementById('adminContent').style.display='block'; renderAdmin(); }
function adjustBalance(){ let code=document.getElementById('adjCode').value.trim(); let amount=parseFloat(document.getElementById('adjAmount').value); let reason=document.getElementById('adjReason').value.trim()||'تحويل إضافي يدوي'; if(!code||isNaN(amount)){alert('اكتب الكود والمبلغ');return;} if(!adjustments[code]) adjustments[code]=[]; adjustments[code].push({amount:amount,reason:reason,date:new Date().toISOString().slice(0,10)}); localStorage.setItem('egazat_adjustments',JSON.stringify(adjustments)); renderAdmin(); }
function renderAdmin(){ if(!hasData)return; let q=(document.getElementById('adminSearch').value||'').toLowerCase(); let filtered=employees.filter(e=>!q||String(e.code).includes(q)||e.name.toLowerCase().includes(q)); let html=`<table><tr><th>كود</th><th>اسم</th><th>نوع</th><th>إدارة</th><th>متبقي</th></tr>`; filtered.slice(0,150).forEach(emp=>{ let finalBal=getFinalBalance(emp); html+=`<tr><td>${emp.code}</td><td>${emp.name.slice(0,18)}</td><td>${emp.type}</td><td>${emp.dept.slice(0,12)}</td><td style="font-weight:900">${finalBal.toFixed(1)}</td></tr>`; }); html+=`</table>`; document.getElementById('adminList').innerHTML=html; }
function clearAllData(){ if(confirm('مسح كل البيانات؟')){ localStorage.clear(); employees=[]; adjustments={}; hasData=false; } }
loadStored();
</script>
</body>
</html>
