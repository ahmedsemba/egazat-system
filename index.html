<script>
// إصلاح دالة getBaseBalance - تمنع أرقام التاريخ الكبيرة
function getBaseBalance(emp){
  let keys=Object.keys(emp.balances);
  if(keys.length===0) return 0;
  // خد آخر شيت لكن تأكد الرقم منطقي
  let val = emp.balances[keys[keys.length-1]];
  if(val > 365 || val > 1000 || val === 43676) return 0; // تاريخ إكسل
  if(isNaN(val)) return 0;
  return val;
}
