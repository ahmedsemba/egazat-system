<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v15.9 كامل</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial}
.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}
input{width:100%;padding:10px;border-radius:8px;background:#0f172a;color:#fff;margin:5px 0}
button{padding:10px;border-radius:8px;background:#10b981;color:#fff;width:100%;margin:4px 0;font-weight:bold}
.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}.btn-red{background:#ef4444}
</style>
</head>
<body>
<div style="padding:15px;text-align:center;background:#1e293b">v15.9 - كامل - زيادة 26 + تصفية + تحويل اضافي</div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981">
<b>اعرف رصيدك بالكود</b>
<input id="empCodeOnly" type="tel" placeholder="101">
<button onclick="searchByCode()">عرض رصيدي</button>
<div id="empResult"></div><div id="publicLoadStatus"></div>
</div>
<div class="card" id="dataStatus" style="display:none"></div>
<div class="card">
<b>ادارة</b>
<input id="adminPass" type="password" placeholder="الباسورد">
<button class="btn-blue" onclick="login()">دخول الادارة</button>
<div id="configArea" style="display:none">
<input id="ghToken" type="password" placeholder="Token">
<button class="btn-blue" onclick="saveToken()">حفظ</button><div id="tokenStatus"></div>
</div>
<div id="adminArea" style="display:none">
<div class="card" style="background:#0f172a;border:2px dashed #10b981">
<b>1- رفع الشيت / تصدير</b>
<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)">
<button class="btn-blue" onclick="document.getElementById('excelFile').click()">اختر الشيت</button>
<button onclick="uploadToGitHub()">رفع على GitHub</button>
<button onclick="exportCurrentExcel()">تصدير الرصيد الحالي Excel</button>
<div id="uploadStatus"></div>
</div>
<div class="card" style="background:#0f172a;border:2px solid #f59e0b">
<b>2- زيادة 26 وتصفية</b>
<button class="btn-orange" onclick="applyMonthlyIncrease()">زيادة يوم 26 - 5 للمغترب / 6 للي كمل 10 حتى شهر 9</button>
<button style="background:#ef4444" onclick="applyAnnualReset()">تصفية 26 ديسمبر</button>
</div>
<div class="card" style="background:#0f172a;border:2px solid #10b981">
<b>3- تحويل اضافي</b>
<input id="adjCode" placeholder="كود"><input id="adjAmount" type="number" step="0.5" placeholder="مثال 2">
<input id="adjReason" placeholder="السبب"><button onclick="editBalance()">زود / نقص</button><div id="adjResult"></div>
</div>
<div class="card" style="background:#0f172a">
<b>4- خصم اجازة</b>
<input id="leaveCode" placeholder="كود"><input id="leaveDays" type="number" placeholder="ايام">
<button class="btn-red" onclick="addLeave()">خصم</button><div id="leaveResult"></div>
</div>
<div class="card"><input id="adminSearch" placeholder="بحث" oninput="renderAdmin()"><div id="adminList"></div></div>
</div>
</div>
</div>
<script>
var employees=[];var hasData=false;
function getGH(){return{user:'ahmedsemba',repo:'egazat-system',token:localStorage.getItem('gh_token')||''};}
function saveToken(){var t=document.getElementById('ghToken').value.trim();if(!t){alert('حط التوكن');return;}localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerHTML='اتحفظ';}
function login(){var p=document.getElementById('adminPass').value;var real='Ahmed@salwa2020';if(p!==real){alert('غلط');return;}var hasToken=localStorage.getItem('gh_token');if(!hasToken){document.getElementById('configArea').style.display='block';document.getElementById('adminArea').style.display='none';return;}document.getElementById('configArea').style.display='none';document.getElementById('adminArea').style.display='block';document.getElementById('dataStatus').style.display='block';loadPublicData();}
function getTenureYears(h){if(!h)return 0;try{var d=new Date(h);if(isNaN(d))return 0;return(new Date()-d)/31557600000;}catch(e){return 0;}}
function parseDateValue(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v;try{var d=new Date(v);if(!isNaN(d))return d;}catch(e){}return null;}
function parseWorkbook(wb){var emps=[];for(var s=0;s<wb.SheetNames.length;s++){var sn=wb.SheetNames[s];var ws=wb.Sheets[sn];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});for(var r=1;r<rows.length;r++){var row=rows[r];if(!row||row[0]==null)continue;var code=parseInt(row[0]);if(isNaN(code))continue;var name=row[1];if(!name)continue;var dept=row[2]||'السائقين';var type=row[3]||'مقيم';var hireVal=row[4];var balVal=row[5];var b=0;if(balVal!=null){var v=parseFloat(String(balVal).replace(',','.'));if(!isNaN(v))b=v;}var hd=parseDateValue(hireVal);var hireStr='';if(hd&&!isNaN(hd)){hireStr=hd.toISOString().slice(0,10);}emps.push({code:code,name:String(name).trim(),dept:String(dept).trim(),type:String(type).trim(),hire:hireStr,balance:b,history:[]});}}employees=emps;hasData=true;document.getElementById('uploadStatus').innerHTML=emps.length+' موظف جاهز';}
function handleExcel(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(evt){var d=new Uint8Array(evt.target.result);var wb=XLSX.read(d,{type:'array',cellDates:true});parseWorkbook(wb);};r.readAsArrayBuffer(f);}
function loadPublicData(){var gh=getGH();var statusEl=document.getElementById('publicLoadStatus');if(statusEl){statusEl.innerHTML='جاري التحميل...';}var url='https://raw.githubusercontent.com/'+gh.user+'/'+gh.repo+'/main/data.json?'+Date.now();fetch(url,{cache:'no-store'}).then(function(res){if(!res.ok)throw new Error('fail');return res.text();}).then(function(txt){if(!txt||txt.trim()==''||txt.trim()=='[]'){if(statusEl)statusEl.innerHTML='السحابة فاضية';return;}var data=JSON.parse(txt);if(data.length>0){employees=data;hasData=true;if(statusEl)statusEl.innerHTML='تم تحميل '+data.length;document.getElementById('dataStatus').innerHTML=data.length+' محمل';localStorage.setItem('egazat_cache',JSON.stringify({time:Date.now(),data:data}));renderAdmin();}}).catch(function(err){var cached=localStorage.getItem('egazat_cache');if(cached){try{var obj=JSON.parse(cached);if(obj&&obj.data&&obj.data.length>0){employees=obj.data;hasData=true;renderAdmin();return;}}catch(e){}}});}
function uploadToGitHub(){if(!hasData){alert('اختر الشيت');return;}var gh=getGH();if(!gh.token){alert('حط التوكن');return;}document.getElementById('uploadStatus').innerHTML='بيرفع...';fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{headers:{'Authorization':'token '+gh.token}}).then(function(getRes){if(getRes.ok){return getRes.json().then(function(j){return j.sha;});}return null;}).then(function(sha){var content=btoa(unescape(encodeURIComponent(JSON.stringify(employees))));return fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{method:'PUT',headers:{'Authorization':'token '+gh.token,'Content-Type':'application/json'},body:JSON.stringify({message:'رفع '+employees.length,content:content,sha:sha})});}).then(function(putRes){if(putRes&&putRes.ok){document.getElementById('uploadStatus').innerHTML='اترفع!';setTimeout(loadPublicData,2000);}});}
function saveToGitHub(){var gh=getGH();if(!gh.token)return;fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{headers:{'Authorization':'token '+gh.token}}).then(function(getRes){if(getRes.ok){return getRes.json();}return null;}).then(function(j){var sha=null;if(j){sha=j.sha;}var content=btoa(unescape(encodeURIComponent(JSON.stringify(employees))));return fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{method:'PUT',headers:{'Authorization':'token '+gh.token,'Content-Type':'application/json'},body:JSON.stringify({message:'تعديل',content:content,sha:sha})});});}
function exportCurrentExcel(){if(employees.length==0){alert('مفيش بيانات');return;}var dataForExcel=[];for(var i=0;i<employees.length;i++){var emp=employees[i];dataForExcel.push({'الكود':emp.code,'الاسم':emp.name,'النوع':emp.type,'الرصيد':emp.balance});}var ws=XLSX.utils.json_to_sheet(dataForExcel);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الوضع الحالي');XLSX.writeFile(wb,'رصيد_حالي.xlsx');}
function editBalance(){var code=document.getElementById('adjCode').value.trim();var amount=parseFloat(document.getElementById('adjAmount').value);var reason=document.getElementById('adjReason').value||'تحويل اضافي';if(!code||isNaN(amount)){alert('اكتب الكود والمبلغ');return;}var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(code)){emp=employees[i];break;}}if(!emp){alert('غير موجود');return;}emp.balance+=amount;if(emp.balance<0){emp.balance=0;}if(!emp.history){emp.history=[];}emp.history.push({id:Date.now(),date:new Date().toISOString().slice(0,10),amount:amount,reason:reason});saveToGitHub();document.getElementById('adjResult').innerHTML='تم - الجديد '+emp.balance;renderAdmin();}
function addLeave(){var code=document.getElementById('leaveCode').value.trim();var days=parseFloat(document.getElementById('leaveDays').value);if(!code||isNaN(days)){alert('اكتب الكود والايام');return;}var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(code)){emp=employees[i];break;}}if(!emp){alert('غير موجود');return;}emp.balance-=days;if(emp.balance<0){emp.balance=0;}if(!emp.history){emp.history=[];}emp.history.push({id:Date.now(),date:new Date().toISOString().slice(0,10),amount:-days,reason:'اجازة'});saveToGitHub();document.getElementById('leaveResult').innerHTML='خصم '+days;renderAdmin();}
function searchByCode(){if(employees.length==0){document.getElementById('empResult').innerHTML='لسه بنحمل...';loadPublicData();return;}var c=document.getElementById('empCodeOnly').value.trim();var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(c)){emp=employees[i];break;}}if(!emp){document.getElementById('empResult').innerHTML='غير موجود';return;}document.getElementById('empResult').innerHTML='<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center"><b>كود: '+emp.code+'</b><div style="font-size:48px;font-weight:900">'+emp.balance.toFixed(1)+'</div><div>يوم</div></div>';}
function renderAdmin(){if(!hasData){document.getElementById('adminList').innerHTML='فاضي';return;}var q=(document.getElementById('adminSearch').value||'').toLowerCase();var filtered=[];for(var i=0;i<employees.length;i++){var e=employees[i];if(!q||String(e.code).indexOf(q)>=0||e.name.toLowerCase().indexOf(q)>=0){filtered.push(e);}}var html='<table style="width:100%;background:#0f172a"><tr><th>كود</th><th>اسم</th><th>رصيد</th></tr>';for(var j=0;j<filtered.length&&j<300;j++){var emp=filtered[j];html+='<tr><td>'+emp.code+'</td><td>'+emp.name.slice(0,18)+'</td><td>'+emp.balance.toFixed(1)+'</td></tr>';}html+='</table>';document.getElementById('adminList').innerHTML=html;}
function applyMonthlyIncrease(){if(!confirm('زيادة 26؟'))return;var month=new Date().getMonth()+1;for(var i=0;i<employees.length;i++){var emp=employees[i];var tenure=getTenureYears(emp.hire);var isMog=String(emp.type).indexOf('مغترب')>=0;var add=0;if(isMog){if(tenure>=10&&month>=1&&month<=9){add=6;}else{add=5;}}else{if(tenure>=10&&month>=1&&month<=9){add=1;}}if(add>0){emp.balance+=add;}}saveToGitHub();alert('تمت الزيادة');renderAdmin();}
function applyAnnualReset(){if(!confirm('تصفية 26 ديسمبر؟'))return;var payoutList=[];for(var i=0;i<employees.length;i++){var emp=employees[i];var isMog=String(emp.type).toLowerCase().indexOf('مغترب')>=0;if(!isMog){if(emp.balance>0){var newAnnual=getTenureYears(emp.hire)>=10?30:21;payoutList.push({'الكود':emp.code,'الاسم':emp.name,'القديم':emp.balance,'الجديد':newAnnual});}}}if(payoutList.length>0){var ws=XLSX.utils.json_to_sheet(payoutList);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'تصفية');XLSX.writeFile(wb,'تصفية.xlsx');}for(var j=0;j<employees.length;j++){var emp2=employees[j];var isMog2=String(emp2.type).toLowerCase().indexOf('مغترب')>=0;var tenure2=getTenureYears(emp2.hire);if(!isMog2){emp2.balance=tenure2>=10?30:21;}else{emp2.balance+=tenure2>=10?6:5;}}saveToGitHub();alert('تمت التصفية');renderAdmin();}
window.addEventListener('DOMContentLoaded',function(){loadPublicData();});
</script>
</body>
</html>
