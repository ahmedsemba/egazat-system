<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الإجازات v9 - شغال لكل الأجهزة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{font-family:Cairo,sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#4f46e5);padding:14px;text-align:center;border-bottom:3px solid #10b981}
.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}
input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}
button{padding:11px;border-radius:9px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px 0;width:100%}
.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}.btn-red{background:#ef4444}.btn-green{background:#10b981}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px}
.tab{padding:10px 18px;background:#334155;border-radius:20px;cursor:pointer;font-weight:700}
.tab.active{background:#10b981;color:#000}
.balance-big{font-size:44px;font-weight:900;color:#10b981;text-align:center}
.alert{padding:9px;border-radius:9px;margin:7px 0;font-size:11px}
.alert-green{background:#065f46;border:1px solid #10b981}.alert-red{background:#7f1d1d;border:1px solid #ef4444}.alert-blue{background:#1e3a8a;border:1px solid #6366f1}
table{width:100%;border-collapse:collapse;margin-top:8px;background:#0f172a;border-radius:8px;overflow:hidden}
th,td{padding:6px;border:1px solid #334155;text-align:center;font-size:10px}
.badge{padding:3px 9px;border-radius:10px;font-size:9px;font-weight:800}
.badge-moght{background:#065f46;color:#10b981}.badge-moqim{background:#1e3a8a;color:#93c5fd}
</style>
</head>
<body>
<div class="header"><h3>🏭 نظام الإجازات v9 - كل الأجهزة نفس الرقم</h3><small>1017=4 عند الكل - تعديل من الموقع</small></div>
<div class="tabs"><div class="tab active" id="btnEmp" onclick="switchTab('emp')">👤 موظف</div><div class="tab" id="btnAdmin" onclick="switchTab('admin')">🔐 إدارة</div></div>
<div id="tab-emp"><div class="card" style="text-align:center;border:2px solid #10b981"><input id="empCodeOnly" type="tel" placeholder="1017" style="text-align:center;font-size:22px;font-weight:900"><button onclick="searchByCode()">🔍 عرض رصيدي</button><div id="empResult"></div></div><div class="card" id="dataStatus"></div></div>
<div id="tab-admin" style="display:none"><div class="card"><input id="adminPass" type="password" placeholder="Ahmed@salwa2020"><button class="btn-blue" onclick="loginAdmin()">دخول</button><div id="adminContent" style="display:none">
<div class="card" style="background:#0f172a;border:2px dashed #10b981"><b>✅ مربوط بـ npoint بتاعك: bc0bd40762673347176a</b><div id="uploadStatus"></div>
<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)">
<button class="btn-blue" onclick="document.getElementById('excelFile').click()">1- اختر الشيت اللي فيه 1017=4</button>
<button class="btn-green" onclick="uploadToCloud()">2- ☁️ رفع للسحابة - الكل هيشوفه</button>
<button class="btn-blue" onclick="loadFromCloud()">🔄 تحميل من السحابة</button>
</div>
<div class="card" style="background:#0f172a"><b>⚙️ كل التعديلات من هنا - بتسمع في كل الأجهزة فوراً</b>
<button class="btn-orange" onclick="applyMonthlyIncrease()">⚡ زيادة يوم 26 - 5 أيام مغترب / 6 للي كمل 10 سنين حتى شهر 9</button>
<button class="btn-orange" onclick="applyAnnualReset()" style="background:#f59e0b">📅 رصيد سنوي جديد 26 ديسمبر - مقيم 21/30 يوم</button>
</div>
<div class="card" style="background:#0f172a;border:2px solid #f59e0b"><b>💰 تصدير مقيمين</b><button class="btn-green" onclick="exportAllResidents()">📗 تصدير Excel - كود/اسم/نوع/إدارة/متبقي</button></div>
<div class="card" style="background:#0f172a;border:2px solid #10b981"><b>➕ تعديل رصيد (زيادة/نقصان) من الموقع</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="adjCode" placeholder="كود: 1017"><input id="adjAmount" type="number" step="0.5" placeholder="+2 أو -1"></div><input id="adjReason" placeholder="السبب"><button class="btn-green" onclick="editBalance()">✅ تعديل - هيظهر عند الكل فوراً</button></div>
<div class="card" style="background:#0f172a;border:2px solid #ef4444"><b>➖ إجازة لشخص من الموقع</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="leaveCode" placeholder="كود: 1017"><input id="leaveDays" type="number" step="0.5" placeholder="أيام الإجازة"></div><input id="leaveReason" placeholder="ملاحظة"><button class="btn-red" onclick="addLeave()">➖ خصم الإجازة - هيظهر عند الكل فوراً</button><div id="leaveResult"></div></div>
<div class="card"><b>📋 كل الموظفين - نفس الرقم عند الكل</b><input id="adminSearch" placeholder="بحث 1017" oninput="renderAdmin()"><div id="adminList"></div></div>
</div></div></div>
<script>
function _0xCheck(p){ const _0xK=[65,104,109,101,100,64,115,97,108,119,97,50,48,50,48]; if(p.length!==_0xK.length) return false; for(let i=0;i<_0xK.length;i++) if(p.charCodeAt(i)!==_0xK[i]) return false; return true; }
const NPOINT_ID = "bc0bd40762673347176a";
const NPOINT_URL = `https://api.npoint.io/${NPOINT_ID}`;
let employees=[],hasData=false;
function switchTab(t){ document.getElementById('tab-emp').style.display=t==='emp'?'block':'none'; document.getElementById('tab-admin').style.display=t==='admin'?'block':'none'; document.getElementById('btnEmp').classList.toggle('active',t==='emp'); document.getElementById('btnAdmin').classList.toggle('active',t==='admin'); if(t==='admin') renderAdmin(); }
function parseWorkbook(wb){
  let emps=[];
  wb.SheetNames.forEach(sheetName=>{
    let ws=wb.Sheets[sheetName];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    for(let r=1;r<rows.length;r++){
      let row=rows[r]; if(!row||row[0]==null) continue;
      let code=parseInt(row[0]); if(isNaN(code)) continue;
      let name=row[1], dept=row[2], type=row[3], hire=row[4], bal=row[5];
      if(!name) continue;
      let b=0; if(bal!=null){ let v=parseFloat(bal); if(!isNaN(v)&&v>=0&&v<=60) b=v; }
      let hd=null;
      if(hire instanceof Date) hd=hire;
      else if(typeof hire==='number'){ hd=new Date((hire-25569)*86400*1000); }
      else if(hire){ let s=String(hire); let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m){ hd=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1])); } else { hd=new Date(s); } }
      let hireStr=hd?hd.toISOString().slice(0,10):'';
      emps.push({code:code,name:String(name).trim(),dept:String(dept||'').trim(),type:String(type||'مقيم').trim(),hire:hireStr,balance:b,history:[]});
    }
  });
  employees=emps; hasData=true;
  document.getElementById('uploadStatus').innerHTML=`<div class="alert alert-green">✅ ${employees.length} موظف جاهز - 1017=${emps.find(e=>e.code==1017)?.balance} - دوس رفع للسحابة</div>`;
}
function handleExcel(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(evt){ try{let data=new Uint8Array(evt.target.result); let wb=XLSX.read(data,{type:'array'}); parseWorkbook(wb);}catch(err){} }; reader.readAsArrayBuffer(file); }
async function loadFromCloud(){
  document.getElementById('dataStatus').innerHTML='<div class="alert alert-blue">⏳ تحميل من السحابة...</div>';
  try{
    let res=await fetch(NPOINT_URL, {cache:'no-store'});
    let data=await res.json();
    if(Array.isArray(data)){ employees=data; }
    else if(data.employees){ employees=data.employees; }
    else if(Object.keys(data).length===0){ employees=[]; }
    else { employees=[]; }
    hasData=employees.length>0;
    if(hasData){
      document.getElementById('dataStatus').innerHTML=`<div class="alert alert-green">✅ ${employees.length} موظف من السحابة - 1017=${employees.find(e=>e.code==1017)?.balance||0} عند الكل مظبوط</div>`;
      renderAdmin();
    } else {
      document.getElementById('dataStatus').innerHTML='<div class="alert alert-red">السحابة فاضية - ارفع الشيت الأول</div>';
    }
  }catch(e){ document.getElementById('dataStatus').innerHTML=`<div class="alert alert-red">❌ ${e.message}</div>`; }
}
async function uploadToCloud(){
  if(!hasData){alert('اختر الشيت الأول');return;}
  try{
    let res=await fetch(NPOINT_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(employees)});
    if(res.ok){ alert(`✅ اترفع للسحابة - ${employees.length} موظف - 1017=4 عند الكل دلوقتي`); loadFromCloud(); }
    else { alert('❌ فشل - جرب تاني'); }
  }catch(e){ alert('❌ '+e.message); }
}
async function saveToCloud(){ await fetch(NPOINT_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(employees)}); }
function getTenureYears(h){ return (new Date()-new Date(h))/(1000*60*60*24*365.25); }
async function editBalance(){
  let code=document.getElementById('adjCode').value.trim(); let amount=parseFloat(document.getElementById('adjAmount').value); let reason=document.getElementById('adjReason').value||'تعديل يدوي';
  if(!code||isNaN(amount)){alert('اكتب الكود والمبلغ');return;}
  let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){alert('الكود غير موجود');return;}
  emp.balance+=amount; if(emp.balance<0) emp.balance=0;
  emp.history=emp.history||[]; emp.history.push({date:new Date().toISOString().slice(0,10), amount:amount, reason:reason});
  await saveToCloud(); alert(`✅ تم تعديل ${emp.name} - الجديد ${emp.balance} - ظاهر عند الكل فوراً`); renderAdmin();
}
async function addLeave(){
  let code=document.getElementById('leaveCode').value.trim(); let days=parseFloat(document.getElementById('leaveDays').value);
  if(!code||isNaN(days)){alert('اكتب الكود وعدد الأيام');return;}
  let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){alert('الكود غير موجود');return;}
  emp.balance-=days; if(emp.balance<0) emp.balance=0;
  emp.history=emp.history||[]; emp.history.push({date:new Date().toISOString().slice(0,10), amount:-days, reason:`إجازة ${days} يوم`});
  await saveToCloud(); document.getElementById('leaveResult').innerHTML=`<div class="alert alert-green">✅ خصم ${days} من ${emp.name} - الجديد ${emp.balance} عند الكل</div>`; renderAdmin();
}
async function applyMonthlyIncrease(){
  if(!confirm('هتزود 5 أيام للمغترب و 6 للي كمل 10 سنين حتى شهر 9 لكل الناس؟')) return;
  for(let emp of employees){
    let tenure=getTenureYears(emp.hire); let month=new Date().getMonth()+1; let isMog=String(emp.type).includes('مغترب'); let add=0;
    if(isMog){ add=5; if(tenure>=10&&month>=1&&month<=9) add=6; } else { if(tenure>=10&&month>=1&&month<=9) add=1; }
    if(add>0){ emp.balance+=add; emp.history=emp.history||[]; emp.history.push({date:new Date().toISOString().slice(0,10), amount:add, reason:`زيادة شهرية`}); }
  }
  await saveToCloud(); alert('✅ تمت زيادة كل الناس - ظاهرة عند الكل فوراً'); renderAdmin();
}
async function applyAnnualReset(){
  if(!confirm('هتطبق الرصيد السنوي 26 ديسمبر - مقيم <10=21 يوم، >=10=30 يوم؟')) return;
  for(let emp of employees){
    if(!String(emp.type).includes('مغترب')){
      let tenure=getTenureYears(emp.hire); let newAnnual=tenure>=10?30:21;
      let diff=newAnnual-emp.balance; emp.balance=newAnnual;
      emp.history=emp.history||[]; emp.history.push({date:new Date().toISOString().slice(0,10), amount:diff, reason:`رصيد سنوي جديد ${newAnnual}`});
    }
  }
  await saveToCloud(); alert('✅ تم تطبيق الرصيد السنوي - ظاهر عند الكل'); renderAdmin();
}
function searchByCode(){ let code=document.getElementById('empCodeOnly').value.trim(); let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){document.getElementById('empResult').innerHTML='❌ الكود غير موجود';return;} document.getElementById('empResult').innerHTML=`<div class="card" style="border:2px solid #10b981"><b>${emp.code} - ${emp.name}</b><br><small>${emp.dept} | ${emp.type} | ${emp.hire}</small><div class="balance-big">${emp.balance.toFixed(1)}</div><div style="text-align:center;font-size:11px">من السحابة - نفس الرقم عند الكل</div></div>`; }
function loginAdmin(){ let p=document.getElementById('adminPass').value; const _0xK=[65,104,109,101,100,64,115,97,108,119,97,50,48,50,48]; let ok=true; if(p.length!==_0xK.length) ok=false; else for(let i=0;i<_0xK.length;i++) if(p.charCodeAt(i)!==_0xK[i]) ok=false; if(!ok){alert('كلمة السر غير صحيحة');return;} document.getElementById('adminContent').style.display='block'; renderAdmin(); loadFromCloud(); }
function renderAdmin(){ if(!hasData){document.getElementById('adminList').innerHTML='حمل من السحابة';return;} let q=(document.getElementById('adminSearch').value||'').toLowerCase(); let filtered=employees.filter(e=>!q||String(e.code).includes(q)||e.name.toLowerCase().includes(q)); let html=`<table><tr><th>كود</th><th>الاسم</th><th>النوع</th><th>الرصيد - عند الكل</th></tr>`; filtered.slice(0,200).forEach(emp=>{ let isMog=String(emp.type).includes('مغترب'); html+=`<tr><td>${emp.code}</td><td style="text-align:right;font-size:9px">${emp.name.slice(0,20)}</td><td><span class="badge ${isMog?'badge-moght':'badge-moqim'}">${isMog?'مغترب':'مقيم'}</span></td><td style="font-weight:900;background:#065f46">${emp.balance.toFixed(1)}</td></tr>`; }); html+=`</table>`; document.getElementById('adminList').innerHTML=html; }
function exportAllResidents(){ let residents=employees.filter(e=>String(e.type).includes('مقيم')); let rows=[["كود الموظف","اسم الموظف","النوع","الإدارة","المتبقي من الرصيد","تاريخ التعيين"]]; residents.forEach(emp=>{ rows.push([emp.code,emp.name,emp.type,emp.dept,emp.balance,emp.hire]); }); let ws=XLSX.utils.aoa_to_sheet(rows); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"مقيمين"); XLSX.writeFile(wb, `ارصدة_مقيمين_${new Date().toISOString().slice(0,10)}.xlsx`); }
setTimeout(loadFromCloud, 800);
</script>
</body>
</html>
