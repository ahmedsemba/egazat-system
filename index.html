<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>v15.8 شغال</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#0f172a;color:#fff;font-family:Arial}.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}button{padding:10px;border-radius:8px;border:none;background:#10b981;color:#fff;font-weight:bold;width:100%;margin:4px 0}.btn-blue{background:#6366f1}.alert-green{background:#065f46;padding:8px;border-radius:8px;margin:6px 0}.alert-blue{background:#1e3a8a;padding:8px;border-radius:8px;margin:6px 0}</style></head><body>
<div style="padding:15px;text-align:center;background:#1e293b;border-bottom:2px solid #10b981"><b>v15.8 - نسخة مضمونة شغالة - فيها تحويل اضافي</b></div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981"><b>اعرف رصيدك بالكود</b><input id="empCodeOnly" type="tel" placeholder="101" style="text-align:center;font-size:22px;font-weight:bold"><button onclick="searchByCode()">عرض رصيدي</button><div id="empResult"></div><div id="publicLoadStatus"></div></div>
<div class="card" id="dataStatus" style="display:none"></div>
<div class="card"><b>ادارة</b><input id="adminPass" type="password" placeholder="الباسورد"><button class="btn-blue" onclick="login()">دخول الادارة</button>
<div id="configArea" style="display:none"><input id="ghToken" type="password" placeholder="Token"><button class="btn-blue" onclick="saveToken()">حفظ التوكن</button><div id="tokenStatus"></div></div>
<div id="adminArea" style="display:none">
<div class="card" style="background:#0f172a"><b>1- رفع الشيت</b><input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)"><button class="btn-blue" onclick="document.getElementById('excelFile').click()">اختر الشيت</button><button onclick="uploadToGitHub()">رفع على GitHub</button><div id="uploadStatus"></div></div>
<div class="card" style="background:#0f172a;border:2px solid #10b981"><b>2- تحويل اضافي لرصيد الاجازات - الميزة اللي طلبتها</b><input id="adjCode" placeholder="كود الموظف"><input id="adjAmount" type="number" step="0.5" placeholder="مثال 2 او -1"><input id="adjReason" placeholder="السبب"><button onclick="editBalance()">زود / نقص - تحويل اضافي</button><div id="adjResult"></div></div>
<div class="card" style="background:#0f172a"><b>3- خصم اجازة</b><input id="leaveCode" placeholder="كود"><input id="leaveDays" type="number" placeholder="ايام"><button onclick="addLeave()">خصم</button><div id="leaveResult"></div></div>
<div class="card"><input id="adminSearch" placeholder="بحث" oninput="renderAdmin()"><div id="adminList"></div></div>
</div></div></div>
<script>
var employees=[];
var hasData=false;
function getGH(){return{user:'ahmedsemba',repo:'egazat-system',token:localStorage.getItem('gh_token')||''};}
function saveToken(){var t=document.getElementById('ghToken').value.trim();if(!t){alert('حط التوكن');return;}localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerHTML='<div class="alert-green">اتحفظ</div>';}
function login(){var p=document.getElementById('adminPass').value;var real='Ahmed@salwa2020';if(p!==real){alert('الباسورد غلط');return;}var hasToken=localStorage.getItem('gh_token');if(!hasToken){document.getElementById('configArea').style.display='block';document.getElementById('adminArea').style.display='none';return;}document.getElementById('configArea').style.display='none';document.getElementById('adminArea').style.display='block';document.getElementById('dataStatus').style.display='block';loadPublicData();}
function getTenureYears(h){if(!h)return 0;try{var d=new Date(h);if(isNaN(d))return 0;return(new Date()-d)/31557600000;}catch(e){return 0;}}
function formatTenure(hireStr){if(!hireStr)return{text:'تاريخ التعيين مش متسجل',remaining:''};try{var hire=new Date(hireStr);if(isNaN(hire))return{text:'تاريخ التعيين مش متسجل',remaining:''};var now=new Date();var totalDays=Math.floor((now-hire)/86400000);var years=Math.floor(totalDays/365.25);var months=Math.floor((totalDays%365.25)/30.44);var remainingText='';if(years>=10){remainingText='كملت 10 سنين - ليك 30 يوم';}else{var targetDate=new Date(hire);targetDate.setFullYear(hire.getFullYear()+10);var remMs=targetDate-now;var remDays=Math.ceil(remMs/86400000);var remMonths=Math.floor(remDays/30.44);var remY=Math.floor(remMonths/12);var remM=remMonths%12;var ytxt='';if(remY>0){ytxt=remY+' سنة و ';}remainingText='فاضلك '+ytxt+remM+' شهر';}return{text:'متعين من '+hire.toLocaleDateString()+' - بقالك '+years+' سنة و '+months+' شهر',remaining:remainingText};}catch(e){return{text:'تاريخ التعيين مش متسجل',remaining:''};}}
function parseDateValue(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v;try{var d=new Date(v);if(!isNaN(d))return d;}catch(e){}return null;}
function parseWorkbook(wb){var emps=[];var i=0;for(var s=0;s<wb.SheetNames.length;s++){var sn=wb.SheetNames[s];var ws=wb.Sheets[sn];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});for(var r=1;r<rows.length;r++){var row=rows[r];if(!row||row[0]==null)continue;var code=parseInt(row[0]);if(isNaN(code))continue;var name=row[1];if(!name)continue;var dept=row[2]||'السائقين';var type=row[3]||'مقيم';var hireVal=row[4];var balVal=row[5];var b=0;if(balVal!=null){var v=parseFloat(String(balVal).replace(',','.'));if(!isNaN(v))b=v;}var hd=parseDateValue(hireVal);var hireStr='';if(hd&&!isNaN(hd)){hireStr=hd.toISOString().slice(0,10);}emps.push({code:code,name:String(name).trim(),dept:String(dept).trim(),type:String(type).trim(),hire:hireStr,balance:b,history:[]});}}employees=emps;hasData=true;document.getElementById('uploadStatus').innerHTML='<div class="alert-green">'+emps.length+' موظف جاهز</div>';}
function handleExcel(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(evt){var d=new Uint8Array(evt.target.result);var wb=XLSX.read(d,{type:'array',cellDates:true});parseWorkbook(wb);};r.readAsArrayBuffer(f);}
function loadPublicData(){var gh=getGH();var statusEl=document.getElementById('publicLoadStatus');if(statusEl){statusEl.innerHTML='⏳ جاري التحميل...';}document.getElementById('dataStatus').style.display='block';document.getElementById('dataStatus').innerHTML='<div class="alert-blue">تحميل...</div>';var url='https://raw.githubusercontent.com/'+gh.user+'/'+gh.repo+'/main/data.json?'+Date.now();fetch(url,{cache:'no-store'}).then(function(res){if(!res.ok){throw new Error('fail');}return res.text();}).then(function(txt){if(!txt||txt.trim()==''||txt.trim()=='[]'){if(statusEl){statusEl.innerHTML='السحابة فاضية';}return;}var data=JSON.parse(txt);if(data.length>0){employees=data;hasData=true;if(statusEl){statusEl.innerHTML='✅ تم تحميل '+data.length+' موظف';}document.getElementById('dataStatus').innerHTML='<div class="alert-green">'+data.length+' محمل</div>';localStorage.setItem('egazat_cache',JSON.stringify({time:Date.now(),data:data}));renderAdmin();}}).catch(function(err){try{var cached=localStorage.getItem('egazat_cache');if(cached){var obj=JSON.parse(cached);if(obj&&obj.data&&obj.data.length>0){employees=obj.data;hasData=true;if(statusEl){statusEl.innerHTML='✅ من الكاش '+obj.data.length;}document.getElementById('dataStatus').innerHTML='<div class="alert-green">'+obj.data.length+' من الكاش</div>';renderAdmin();return;}} }catch(e2){}if(statusEl){statusEl.innerHTML='❌ فشل التحميل - تأكد إن الريبو Public<br><small>هيظهر: رصيدك - تاريخ تعيينك - بقالك قد ايه</small>';}});}
function loadFromGitHub(){loadPublicData();}
function uploadToGitHub(){if(!hasData){alert('اختر الشيت');return;}var gh=getGH();if(!gh.token){alert('حط التوكن');return;}document.getElementById('uploadStatus').innerHTML='<div class="alert-blue">بيرفع...</div>';fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{headers:{'Authorization':'token '+gh.token}}).then(function(getRes){var sha=null;if(getRes.ok){return getRes.json().then(function(j){sha=j.sha;return sha;});}return null;}).then(function(sha){var content=btoa(unescape(encodeURIComponent(JSON.stringify(employees))));return fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{method:'PUT',headers:{'Authorization':'token '+gh.token,'Content-Type':'application/json'},body:JSON.stringify({message:'رفع '+employees.length,content:content,sha:sha})});}).then(function(putRes){if(putRes&&putRes.ok){document.getElementById('uploadStatus').innerHTML='<div class="alert-green">اترفع!</div>';setTimeout(loadPublicData,2000);}});}
function saveToGitHub(){var gh=getGH();if(!gh.token)return;fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{headers:{'Authorization':'token '+gh.token}}).then(function(getRes){if(getRes.ok){return getRes.json();}return null;}).then(function(j){var sha=null;if(j){sha=j.sha;}var content=btoa(unescape(encodeURIComponent(JSON.stringify(employees))));return fetch('https://api.github.com/repos/'+gh.user+'/'+gh.repo+'/contents/data.json',{method:'PUT',headers:{'Authorization':'token '+gh.token,'Content-Type':'application/json'},body:JSON.stringify({message:'تعديل',content:content,sha:sha})});});}
function editBalance(){var code=document.getElementById('adjCode').value.trim();var amount=parseFloat(document.getElementById('adjAmount').value);var reason=document.getElementById('adjReason').value||'تحويل اضافي';if(!code||isNaN(amount)){alert('اكتب الكود والمبلغ');return;}var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(code)){emp=employees[i];break;}}if(!emp){alert('الكود غير موجود');return;}emp.balance+=amount;if(emp.balance<0){emp.balance=0;}if(!emp.history){emp.history=[];}emp.history.push({id:Date.now(),date:new Date().toISOString().slice(0,10),amount:amount,reason:reason});saveToGitHub();document.getElementById('adjResult').innerHTML='<div class="alert-green">تم - الجديد '+emp.balance+'</div>';renderAdmin();}
function addLeave(){var code=document.getElementById('leaveCode').value.trim();var days=parseFloat(document.getElementById('leaveDays').value);if(!code||isNaN(days)){alert('اكتب الكود والايام');return;}var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(code)){emp=employees[i];break;}}if(!emp){alert('غير موجود');return;}emp.balance-=days;if(emp.balance<0){emp.balance=0;}if(!emp.history){emp.history=[];}emp.history.push({id:Date.now(),date:new Date().toISOString().slice(0,10),amount:-days,reason:'اجازة '+days});saveToGitHub();document.getElementById('leaveResult').innerHTML='<div class="alert-green">خصم '+days+' الجديد '+emp.balance+'</div>';renderAdmin();}
function searchByCode(){if(employees.length===0){document.getElementById('empResult').innerHTML='<div class="alert-blue">لسه بنحمل... دوس تاني</div>';loadPublicData();return;}var c=document.getElementById('empCodeOnly').value.trim();var emp=null;for(var i=0;i<employees.length;i++){if(String(employees[i].code)===String(c)){emp=employees[i];break;}}if(!emp){document.getElementById('empResult').innerHTML='❌ الكود '+c+' غير موجود - المحمل '+employees.length;return;}var tenure=formatTenure(emp.hire);var currentYear=new Date().getFullYear();var taken=0;if(emp.history){for(var k=0;k<emp.history.length;k++){var h=emp.history[k];if(String(h.date).indexOf(String(currentYear))===0&&h.amount<0){taken+=Math.abs(h.amount);}}}document.getElementById('empResult').innerHTML='<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center;margin-top:10px"><b>كود: '+emp.code+' - '+emp.type+'</b><div style="font-size:48px;font-weight:900;color:#10b981;margin:8px 0">'+emp.balance.toFixed(1)+'</div><div>يوم رصيد متبقي</div><div style="background:#0f172a;padding:10px;border-radius:8px;margin-top:10px;text-align:right"><b>تاريخ تعيينك</b><br>'+tenure.text+'<br><small style="color:#10b981">'+tenure.remaining+'</small></div></div>';}
function renderAdmin(){if(!hasData){document.getElementById('adminList').innerHTML='فاضي';return;}var q=(document.getElementById('adminSearch').value||'').toLowerCase();var filtered=[];for(var i=0;i<employees.length;i++){var e=employees[i];if(!q||String(e.code).indexOf(q)>=0||e.name.toLowerCase().indexOf(q)>=0){filtered.push(e);}}var html='<table style="width:100%;border-collapse:collapse;background:#0f172a"><tr><th style="padding:6px;border:1px solid #334155">كود</th><th style="padding:6px;border:1px solid #334155">اسم</th><th style="padding:6px;border:1px solid #334155">رصيد</th></tr>';for(var j=0;j<filtered.length&&j<300;j++){var emp=filtered[j];html+='<tr><td style="padding:6px;border:1px solid #334155">'+emp.code+'</td><td style="padding:6px;border:1px solid #334155;font-size:9px">'+emp.name.slice(0,18)+'</td><td style="padding:6px;border:1px solid #334155;background:#065f46;font-weight:bold">'+emp.balance.toFixed(1)+'</td></tr>';}html+='</table>';document.getElementById('adminList').innerHTML=html;}
window.addEventListener('DOMContentLoaded',function(){loadPublicData();});
</script></body></html>
