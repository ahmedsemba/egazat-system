<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>رصيد الاجازات v15.6</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}button{padding:11px;border-radius:9px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px 0;width:100%}.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}.btn-red{background:#ef4444}.alert-green{background:#065f46;border:1px solid #10b981;padding:9px;border-radius:9px;margin:7px 0;font-size:12px}.alert-blue{background:#1e3a8a;border:1px solid #6366f1;padding:9px;border-radius:9px;margin:7px 0;font-size:12px}</style></head><body>
<div style="background:linear-gradient(135deg,#0f172a,#4f46e5);padding:16px;text-align:center;border-bottom:3px solid #10b981"><h3 style="margin:0">ادارة رصيد الاجازات - v15.6 - شغال على كل الاجهزة</h3></div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981;background:linear-gradient(135deg,#1e293b,#065f46)"><b>اعرف رصيدك - بالكود فقط</b><input id="empCodeOnly" type="tel" placeholder="اكتب كودك مثلا 101" style="text-align:center;font-size:22px;font-weight:900;margin-top:10px"><button onclick="searchByCode()" style="font-size:16px">عرض رصيدي</button><div id="empResult"></div><div id="publicLoadStatus" style="margin-top:8px;font-size:11px"></div></div>
<div class="card" id="dataStatus" style="display:none"></div>
<div class="card" style="border:2px solid #6366f1"><b>ادارة</b><input id="adminPass" type="password" placeholder="الباسورد"><button class="btn-blue" onclick="login()">دخول الادارة</button>
<div id="configArea" style="display:none;background:#0f172a;padding:10px;border-radius:10px;margin-top:10px"><input id="ghToken" type="password" placeholder="Token"><button class="btn-blue" onclick="saveToken()">حفظ</button><div id="tokenStatus"></div></div>
<div id="adminArea" style="display:none;margin-top:15px;border-top:2px dashed #6366f1;padding-top:15px">
<div class="card" style="background:#0f172a;border:2px dashed #10b981;margin:0"><b>رفع الشيت</b><input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)"><button class="btn-blue" onclick="document.getElementById('excelFile').click()">اختر الشيت</button><button style="background:#10b981" onclick="uploadToGitHub()">رفع على GitHub</button><div id="uploadStatus"></div></div>
<div class="card"><input id="adminSearch" placeholder="بحث بالكود او الاسم" oninput="renderAdmin()"><div id="adminList"></div></div>
</div></div></div>
<script>
let employees=[],hasData=false;
function getGH(){return{user:'ahmedsemba',repo:'egazat-system',token:localStorage.getItem('gh_token')||''}}
function saveToken(){let t=document.getElementById('ghToken').value.trim();if(!t){alert('حط التوكن');return;}localStorage.setItem('gh_token',t);document.getElementById('tokenStatus').innerHTML='<div class="alert-green">اتحفظ</div>';}
function login(){let p=document.getElementById('adminPass').value;const K=[65,104,109,101,100,64,115,97,108,119,97,50,48,50,48];let ok=p.length===K.length;if(ok)for(let i=0;i<K.length;i++)if(p.charCodeAt(i)!==K[i])ok=false;if(!ok){alert('الباسورد غلط');return;}let hasToken=localStorage.getItem('gh_token');if(!hasToken){document.getElementById('configArea').style.display='block';document.getElementById('adminArea').style.display='none';return;}document.getElementById('configArea').style.display='none';document.getElementById('adminArea').style.display='block';document.getElementById('dataStatus').style.display='block';loadPublicData();}
function getTenureYears(h){if(!h)return 0;try{let d=new Date(h);if(isNaN(d))return 0;return(new Date()-d)/31557600000;}catch(e){return 0;}}
function formatTenure(hireStr){if(!hireStr)return{text:'تاريخ التعيين مش متسجل',remaining:''};try{let hire=new Date(hireStr);if(isNaN(hire))return{text:'تاريخ التعيين مش متسجل',remaining:''};let now=new Date();let totalDays=Math.floor((now-hire)/86400000);let years=Math.floor(totalDays/365.25);let months=Math.floor((totalDays%365.25)/30.44);let remainingText='';if(years>=10){remainingText='✅ كملت 10 سنين - ليك 30 يوم';}else{let targetDate=new Date(hire);targetDate.setFullYear(hire.getFullYear()+10);let remMs=targetDate-now;let remDays=Math.ceil(remMs/86400000);let remMonths=Math.floor(remDays/30.44);let remY=Math.floor(remMonths/12);let remM=remMonths%12;remainingText='⏳ فاضلك '+(remY>0?remY+' سنة و ':'')+remM+' شهر وتكمل 10 سنين - هتكمل في '+targetDate.toLocaleDateString('ar-EG');}return{text:'📅 متعين من '+hire.toLocaleDateString('ar-EG')+' - بقالك '+years+' سنة و '+months+' شهر',remaining:remainingText};}catch(e){return{text:'تاريخ التعيين مش متسجل',remaining:''};}}
function parseDateValue(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&v>20000&&v<60000){try{let d=new Date((v-25569)*86400000);if(!isNaN(d))return d;}catch(e){}}try{let d=new Date(v);if(!isNaN(d))return d;}catch(e){}return null;}
function parseWorkbook(wb){let emps=[];wb.SheetNames.forEach(sn=>{let ws=wb.Sheets[sn];let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});for(let r=1;r<rows.length;r++){let row=rows[r];if(!row||row[0]==null)continue;let code=parseInt(row[0]);if(isNaN(code))continue;let name=row[1];if(!name)continue;let dept=row[2]||'السائقين';let type=row[3]||'مقيم';let hireVal=row[4];let balVal=row[5];let b=0;if(balVal!=null){let v=parseFloat(String(balVal).replace(',','.'));if(!isNaN(v))b=v;}let hd=parseDateValue(hireVal);let hireStr=hd&&!isNaN(hd)?hd.toISOString().slice(0,10):'';emps.push({code:code,name:String(name).trim(),dept:String(dept).trim(),type:String(type).trim(),hire:hireStr,balance:b,history:[]});}});employees=emps;hasData=true;document.getElementById('uploadStatus').innerHTML='<div class="alert-green">'+emps.length+' موظف جاهز للرفع</div>';}
function handleExcel(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(evt){let d=new Uint8Array(evt.target.result);let wb=XLSX.read(d,{type:'array',cellDates:true});parseWorkbook(wb);};r.readAsArrayBuffer(f);}
async function loadPublicData(){let{user,repo}=getGH();let statusEl=document.getElementById('publicLoadStatus');if(statusEl)statusEl.innerHTML='جاري تحميل البيانات...';document.getElementById('dataStatus').style.display='block';document.getElementById('dataStatus').innerHTML='<div class="alert-blue">تحميل...</div>';try{let res=await fetch('https://raw.githubusercontent.com/'+user+'/'+repo+'/main/data.json?'+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('fail');let txt=await res.text();if(!txt||txt.trim()==''||txt.trim()=='[]')return;let data=JSON.parse(txt);if(Array.isArray(data)&&data.length>0){employees=data;hasData=true;if(statusEl)statusEl.innerHTML='';document.getElementById('dataStatus').style.display='none';localStorage.setItem('egazat_cache',JSON.stringify({time:Date.now(),data:data}));renderAdmin();}}catch(e){try{let cached=localStorage.getItem('egazat_cache');if(cached){let obj=JSON.parse(cached);if(obj&&obj.data&&obj.data.length>0){employees=obj.data;hasData=true;if(statusEl)statusEl.innerHTML='';document.getElementById('dataStatus').style.display='none';renderAdmin();return;}}catch(e2){}if(statusEl)statusEl.innerHTML='';document.getElementById('dataStatus').style.display='none';}}
async function loadFromGitHub(){return loadPublicData();}
async function uploadToGitHub(){if(!hasData){alert('اختر الشيت');return;}let{user,repo,token}=getGH();if(!token){alert('حط التوكن');return;}document.getElementById('uploadStatus').innerHTML='<div class="alert-blue">بيرفع...</div>';try{let getRes=await fetch('https://api.github.com/repos/'+user+'/'+repo+'/contents/data.json',{headers:{'Authorization':'token '+token}});let sha=null;if(getRes.ok){let j=await getRes.json();sha=j.sha;}let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees))));let putRes=await fetch('https://api.github.com/repos/'+user+'/'+repo+'/contents/data.json',{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'رفع '+employees.length,content:content,sha:sha})});if(putRes.ok){document.getElementById('uploadStatus').innerHTML='<div class="alert-green">اترفع! اي موبايل هيشوفه</div>';setTimeout(loadPublicData,2000);}}catch(e){}}
function searchByCode(){if(employees.length===0){document.getElementById('empResult').innerHTML='<div class="alert-blue">لسه بنحمل... دوس تاني بعد ثانية</div>';loadPublicData();return;}let c=document.getElementById('empCodeOnly').value.trim();let emp=employees.find(e=>String(e.code)===String(c));if(!emp){document.getElementById('empResult').innerHTML='❌ الكود '+c+' غير موجود - المحمل '+employees.length;return;}let tenure=formatTenure(emp.hire);let currentYear=new Date().getFullYear();let taken=(emp.history||[]).filter(h=>String(h.date).startsWith(String(currentYear))&&h.amount<0).reduce((s,h)=>s+Math.abs(h.amount),0);document.getElementById('empResult').innerHTML='<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center;margin-top:10px"><b>كود: '+emp.code+' - '+emp.type+'</b><div style="font-size:48px;font-weight:900;color:#10b981;margin:8px 0">'+emp.balance.toFixed(1)+'</div><div style="font-size:14px">يوم رصيد متبقي</div><div style="background:#0f172a;padding:10px;border-radius:8px;margin-top:10px;text-align:right"><b style="color:#f59e0b">📅 تاريخ تعيينك</b><br>'+tenure.text+'<br><small style="color:#10b981">'+tenure.remaining+'</small><br><br><b style="color:#f59e0b">📅 اجازاتك في '+currentYear+': واخد '+taken+' يوم</b></div></div>';document.getElementById('dataStatus').style.display='none';document.getElementById('publicLoadStatus').style.display='none';}
function renderAdmin(){if(!hasData){document.getElementById('adminList').innerHTML='فاضي';return;}let q=(document.getElementById('adminSearch').value||'').toLowerCase();let filtered=employees.filter(e=>!q||String(e.code).includes(q)||e.name.toLowerCase().includes(q));let html='<table style="width:100%;border-collapse:collapse;background:#0f172a"><tr><th style="padding:6px;border:1px solid #334155">كود</th><th style="padding:6px;border:1px solid #334155">اسم</th><th style="padding:6px;border:1px solid #334155">رصيد</th></tr>';filtered.slice(0,300).forEach(emp=>{html+='<tr><td style="padding:6px;border:1px solid #334155">'+emp.code+'</td><td style="padding:6px;border:1px solid #334155;font-size:9px">'+emp.name.slice(0,18)+'</td><td style="padding:6px;border:1px solid #334155;background:#065f46;font-weight:900">'+emp.balance.toFixed(1)+'</td></tr>';});html+='</table>';document.getElementById('adminList').innerHTML=html;}
window.addEventListener('DOMContentLoaded',()=>{loadPublicData();});
</script></body></html>
