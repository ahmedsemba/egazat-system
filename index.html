<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام رصيد الإجازات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{font-family:Cairo,sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#4f46e5);padding:20px;text-align:center;border-bottom:3px solid #10b981}
.card{background:#1e293b;margin:12px;padding:18px;border-radius:14px;border:1px solid #334155}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:8px 0;font-size:14px}
button{padding:12px 20px;border-radius:10px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px}
.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}
.tabs{display:flex;gap:8px;justify-content:center;margin:15px}
.tab{padding:12px 22px;background:#334155;border-radius:25px;cursor:pointer;font-weight:700}
.tab.active{background:#10b981;color:#000}
.balance-big{font-size:52px;font-weight:900;color:#10b981;text-align:center;margin:10px 0}
.alert{padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
.alert-green{background:#065f46;border:1px solid #10b981}
.alert-red{background:#7f1d1d;border:1px solid #ef4444}
.alert-blue{background:#1e3a8a;border:1px solid #6366f1}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#0f172a;border-radius:10px;overflow:hidden}
th,td{padding:8px;border:1px solid #334155;text-align:center;font-size:11px}
th{background:#334155}
.upload-area{border:3px dashed #10b981;padding:25px;border-radius:15px;text-align:center;background:#0f172a;margin:15px 0;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🏭 نظام رصيد الإجازات</h2>
<p style="margin:6px 0 0 0;font-size:12px;color:#94a3b8">الموظف يبحث بكوده</p>
</div>
<div class="tabs">
<div class="tab active" id="btnEmp" onclick="switchTab('emp')">👤 دخول الموظف</div>
<div class="tab" id="btnAdmin" onclick="switchTab('admin')">🔐 الإدارة</div>
</div>
<div id="tab-emp">
<div class="card" style="text-align:center;border:2px solid #10b981">
<h3>👤 استعلام عن رصيدك</h3>
<input id="empCodeOnly" type="tel" placeholder="مثال: 101" style="text-align:center;font-size:24px;letter-spacing:4px;font-weight:900">
<button onclick="searchByCode()" style="width:100%;font-size:18px;margin-top:12px">🔍 عرض رصيدي</button>
<div id="empResult" style="margin-top:15px"></div>
</div>
<div class="card" id="dataStatus"></div>
</div>
<div id="tab-admin" style="display:none">
<div class="card">
<h3>🔐 دخول الإدارة</h3>
<input id="adminPass" type="password" placeholder="كلمة السر الخاصة">
<button class="btn-blue" onclick="loginAdmin()">دخول</button>
<div id="adminContent" style="display:none">
<hr style="border-color:#334155;margin:20px 0">
<h3>📤 رفع ملف الإجازات</h3>
<div class="upload-area" onclick="document.getElementById('excelFile').click()">
📁 اضغط لاختيار ملف الإكسل<br><small>.xlsx</small>
<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)">
</div>
<div id="uploadStatus"></div>
<button class="btn-blue" onclick="loadFromServer()" style="width:100%;margin-top:10px">🔄 تحميل تلقائي من data.xlsx</button>
<hr style="border-color:#334155;margin:20px 0">
<h3>⚙️ تعديل رصيد (تحويل إضافي)</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input id="adjCode" placeholder="كود الموظف">
<input id="adjAmount" type="number" step="0.5" placeholder="+1 أو -1">
</div>
<input id="adjReason" placeholder="السبب">
<button class="btn-orange" onclick="adjustBalance()" style="width:100%">✅ تطبيق</button>
<div id="adjHistory"></div>
<hr style="border-color:#334155;margin:20px 0">
<button class="btn-blue" onclick="clearAllData()" style="background:#334155">🗑️ مسح البيانات وبدء سنة جديدة</button>
<hr style="border-color:#334155;margin:20px 0">
<h3>📋 كل الموظفين</h3>
<input id="adminSearch" placeholder="بحث..." oninput="renderAdmin()" style="width:100%">
<div id="adminList"></div>
<button class="btn-blue" onclick="exportAll()">📤 تصدير CSV</button>
</div>
</div>
</div>
<script>
// === تشفير الباسورد - لا يوجد نص صريح ===
function _0xCheck(p){
  // الباسورد متخزن كأكواد وليس كنص: Semba@2026
  const _0xK = [83,101,109,98,97,64,50,48,50,54];
  if(p.length !== _0xK.length) return false;
  for(let i=0;i<_0xK.length;i++){
    if(p.charCodeAt(i) !== _0xK[i]) return false;
  }
  return true;
}

let employees = [];
let adjustments = {};
let hasData = false;

function loadStored(){
  let stored = localStorage.getItem('egazat_employees');
  let storedAdj = localStorage.getItem('egazat_adjustments');
  if(stored){ try{ employees = JSON.parse(stored); hasData = employees.length>0; }catch(e){} }
  if(storedAdj){ try{ adjustments = JSON.parse(storedAdj); }catch(e){} }
  updateStatus();
  if(!hasData){ loadFromServer(); }
}
function updateStatus(){
  let div = document.getElementById('dataStatus');
  if(hasData){
    div.innerHTML = `<div class="alert alert-green">✅ يوجد بيانات: ${employees.length} موظف</div>`;
  } else {
    div.innerHTML = `<div class="alert alert-red">⏳ جاري تحميل البيانات...</div>`;
  }
}
function switchTab(t){
 document.getElementById('tab-emp').style.display=t==='emp'?'block':'none';
 document.getElementById('tab-admin').style.display=t==='admin'?'block':'none';
 document.getElementById('btnEmp').classList.toggle('active', t==='emp');
 document.getElementById('btnAdmin').classList.toggle('active', t==='admin');
 if(t==='admin') renderAdmin();
}
function parseWorkbook(wb){
  let emps = {};
  wb.SheetNames.forEach(sheetName=>{
    let ws = wb.Sheets[sheetName];
    let rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    for(let r=2;r<rows.length;r++){
      let row = rows[r];
      let code = row[0]; let name = row[1]; let dept = row[2]; let hire = row[3]; let balance = row[5];
      if(code==null || name==null) continue;
      code = parseInt(code); if(isNaN(code)) continue;
      if(!emps[code]){
        let hireStr = "2000-01-01";
        if(hire){
          if(typeof hire === 'number'){
            let d = new Date((hire - 25569)*86400*1000);
            hireStr = d.toISOString().slice(0,10);
          } else { hireStr = String(hire).slice(0,10); }
        }
        emps[code] = {code:code, name:String(name).trim(), dept:String(dept||"").trim(), hire:hireStr, balances:{}, leaves_count:{}};
      }
      let balVal = 0;
      if(balance!=null){
        let s = String(balance);
        if(s.includes('+')){
          let tot=0; s.split('+').forEach(p=>{ let v=parseFloat(p); if(!isNaN(v)) tot+=v; }); balVal=tot;
        } else { let v=parseFloat(s); if(!isNaN(v)) balVal=v; }
      }
      emps[code].balances[sheetName]=balVal;
      let leaveDays=0;
      for(let c=6;c<37;c++){ if(row[c]==1 || row[c]==1.0 || row[c]=="1") leaveDays++; }
      if(leaveDays>0) emps[code].leaves_count[sheetName]=leaveDays;
    }
  });
  employees = Object.values(emps);
  hasData = true;
  localStorage.setItem('egazat_employees', JSON.stringify(employees));
  localStorage.setItem('egazat_date', new Date().toLocaleString('ar-EG'));
  updateStatus(); renderAdmin();
}
function handleExcel(e){
  let file = e.target.files[0]; if(!file) return;
  document.getElementById('uploadStatus').innerHTML = '<div class="alert alert-blue">⏳ جاري القراءة...</div>';
  let reader = new FileReader();
  reader.onload = function(evt){
    try{
      let data = new Uint8Array(evt.target.result);
      let wb = XLSX.read(data, {type:'array'});
      parseWorkbook(wb);
      document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-green">✅ تم تحميل ${employees.length} موظف!</div>`;
    }catch(err){ document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-red">❌ ${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}
async function loadFromServer(){
  const filesToTry = ['data.xlsx','Data.xlsx'];
  for(let fname of filesToTry){
    try{
      let res = await fetch('./'+fname);
      if(!res.ok) continue;
      let ab = await res.arrayBuffer();
      let wb = XLSX.read(new Uint8Array(ab), {type:'array'});
      parseWorkbook(wb);
      document.getElementById('uploadStatus').innerHTML = `<div class="alert alert-green">✅ تحميل تلقائي من ${fname}</div>`;
      return;
    }catch(e){}
  }
}
function getBaseBalance(emp){
  let months=['11-2026','10-2026','9-2026','8-2026','7-2026','6-2026','5-2026','4-2026','3-2026','2-2026','1-2026','12-2025'];
  for(let m of months){ if(emp.balances[m]!==undefined) return emp.balances[m]; }
  let keys = Object.keys(emp.balances); if(keys.length>0) return emp.balances[keys[keys.length-1]]; return 0;
}
function getFinalBalance(emp){
  let base=getBaseBalance(emp);
  let adjList=adjustments[String(emp.code)]||[];
  let adjSum=adjList.reduce((s,a)=>s+parseFloat(a.amount||0),0);
  return base+adjSum;
}
function searchByCode(){
 let code=document.getElementById('empCodeOnly').value.trim();
 let out=document.getElementById('empResult');
 if(!code){ out.innerHTML='<div class="alert alert-red">اكتب الكود</div>'; return; }
 if(!hasData){ out.innerHTML='<div class="alert alert-red">❌ لا يوجد بيانات</div>'; loadFromServer(); return; }
 let emp=employees.find(e=>String(e.code)===String(code));
 if(!emp){ out.innerHTML='<div class="alert alert-red">❌ الكود غير موجود</div>'; return; }
 let base=getBaseBalance(emp);
 let adjList=adjustments[String(emp.code)]||[];
 let adjSum=adjList.reduce((s,a)=>s+parseFloat(a.amount||0),0);
 let finalBal=base+adjSum;
 let totalLeaves=0; for(let k in emp.leaves_count) totalLeaves+=emp.leaves_count[k];
 out.innerHTML=`
 <div class="card" style="border:2px solid #10b981;text-align:right">
 <div style="text-align:center"><b style="font-size:20px">${emp.code} - ${emp.name}</b><br><small style="color:#94a3b8">${emp.dept}</small></div>
 <div class="balance-big">${finalBal.toFixed(1)}</div>
 <div style="text-align:center;font-size:13px;color:#94a3b8">يوم متبقي</div>
 <div class="alert alert-green">الأساسي: ${base} | إضافي: ${adjSum} | غياب: ${totalLeaves}</div>
 </div>`;
}
function loginAdmin(){
 let p=document.getElementById('adminPass').value;
 if(!_0xCheck(p)){ alert('كلمة السر غير صحيحة'); return; }
 document.getElementById('adminContent').style.display='block';
 renderAdmin();
}
function adjustBalance(){
 let code=document.getElementById('adjCode').value.trim();
 let amount=parseFloat(document.getElementById('adjAmount').value);
 let reason=document.getElementById('adjReason').value.trim()||'تحويل إضافي';
 if(!code||isNaN(amount)){ alert('اكتب الكود والمبلغ'); return; }
 let emp=employees.find(e=>String(e.code)===String(code));
 if(!emp){ alert('الكود غير موجود'); return; }
 if(!adjustments[code]) adjustments[code]=[];
 adjustments[code].push({amount:amount, reason:reason, date:new Date().toISOString().slice(0,10)});
 localStorage.setItem('egazat_adjustments', JSON.stringify(adjustments));
 alert(`✅ تم - الرصيد الجديد: ${getFinalBalance(emp).toFixed(1)}`);
 renderAdmin();
}
function renderAdjHistory(){}
function renderAdmin(){
 if(!hasData){ document.getElementById('adminList').innerHTML='<div class="alert alert-red">ارفع الشيت أولا</div>'; return; }
 let q=(document.getElementById('adminSearch').value||'').toLowerCase();
 let listDiv=document.getElementById('adminList');
 let filtered=employees.filter(e=> !q || String(e.code).includes(q) || e.name.toLowerCase().includes(q));
 let html=`<table><tr><th>الكود</th><th>الاسم</th><th>نهائي</th></tr>`;
 filtered.slice(0,100).forEach(emp=>{
   let finalBal=getFinalBalance(emp);
   html+=`<tr><td>${emp.code}</td><td style="text-align:right;font-size:10px">${emp.name.slice(0,20)}</td><td style="font-weight:900;background:${finalBal<3?'#7f1d1d':'#065f46'}">${finalBal.toFixed(1)}</td></tr>`;
 });
 html+=`</table>`; listDiv.innerHTML=html;
}
function exportAll(){
 if(!hasData){ alert('لا يوجد بيانات'); return; }
 let csv="\uFEFFالكود,الاسم,النهائي\n";
 employees.forEach(e=>{ csv+=`${e.code},"${e.name}",${getFinalBalance(e)}\n`; });
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='رصيد.csv'; a.click();
}
function clearAllData(){
 if(confirm('مسح البيانات؟')){
   localStorage.removeItem('egazat_employees');
   localStorage.removeItem('egazat_adjustments');
   employees=[]; adjustments={}; hasData=false;
   updateStatus(); renderAdmin();
 }
}
loadStored();
</script>
</body>
</html>
