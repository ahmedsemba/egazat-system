<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>نظام الإجازات - GitHub نهائي - 1017=4 عند الكل</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}input{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}button{padding:11px;border-radius:9px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px 0;width:100%}.btn-blue{background:#6366f1}.btn-green{background:#10b981}.alert{padding:9px;border-radius:9px;margin:7px 0;font-size:11px}.alert-green{background:#065f46;border:1px solid #10b981}.alert-red{background:#7f1d1d;border:1px solid #ef4444}.alert-blue{background:#1e3a8a;border:1px solid #6366f1}.balance-big{font-size:44px;font-weight:900;color:#10b981;text-align:center}</style></head><body>
<div style="background:linear-gradient(135deg,#0f172a,#4f46e5);padding:14px;text-align:center;border-bottom:3px solid #10b981"><h3>🏭 نظام الإجازات - GitHub - 1017=4 عند الكل</h3></div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981"><input id="empCodeOnly" type="tel" placeholder="1017" style="text-align:center;font-size:22px;font-weight:900"><button onclick="searchByCode()">🔍 عرض رصيدي - من GitHub مباشرة</button><div id="empResult"></div></div>
<div class="card" id="dataStatus"></div>
<div class="card" style="border:2px dashed #10b981"><b>🔐 دخول الإدارة</b><input id="adminPass" type="password" placeholder="Ahmed@salwa2020"><input id="ghUser" placeholder="اليوزر: ahmedsemba" value="ahmedsemba"><input id="ghRepo" placeholder="الريبو: egazat-system" value="egazat-system"><input id="ghToken" placeholder="التوكن ghp_..."><button class="btn-blue" onclick="loginAndLoad()">دخول + تحميل من GitHub</button><div id="adminArea" style="display:none">
<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)">
<button class="btn-blue" onclick="document.getElementById('excelFile').click()">1- اختر الشيت اللي فيه 1017=4</button>
<button class="btn-green" onclick="uploadToGitHub()">2- ☁️ رفع على GitHub - الكل هيشوفه بعد دقيقة</button>
<div id="uploadStatus"></div>
<button class="btn-blue" onclick="applyMonthlyIncrease()" style="background:#f59e0b;color:#000;margin-top:10px">⚡ زيادة يوم 26</button>
<div style="margin-top:10px"><b>تعديل رصيد:</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="adjCode" placeholder="1017"><input id="adjAmount" type="number" step="0.5" placeholder="+2"></div><button class="btn-green" onclick="editBalance()">✅ تعديل</button></div>
<div style="margin-top:10px"><b>إجازة:</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="leaveCode" placeholder="1017"><input id="leaveDays" type="number" step="0.5" placeholder="أيام"></div><button style="background:#ef4444" onclick="addLeave()">➖ خصم</button></div>
</div></div>
</div>
<script>
let employees=[],hasData=false;
function getGH(){ return {user:document.getElementById('ghUser').value.trim(), repo:document.getElementById('ghRepo').value.trim(), token:document.getElementById('ghToken').value.trim()} }
function loginAndLoad(){ let p=document.getElementById('adminPass').value; if(p!=="Ahmed@salwa2020"){alert('الباسورد غلط');return;} localStorage.setItem('gh_user',getGH().user); localStorage.setItem('gh_repo',getGH().repo); localStorage.setItem('gh_token',getGH().token); document.getElementById('adminArea').style.display='block'; loadFromGitHub(); }
function parseWorkbook(wb){ let emps=[]; wb.SheetNames.forEach(sn=>{ let ws=wb.Sheets[sn]; let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}); for(let r=1;r<rows.length;r++){ let row=rows[r]; if(!row||row[0]==null) continue; let code=parseInt(row[0]); if(isNaN(code)) continue; let name=row[1], dept=row[2], type=row[3], bal=row[5]; if(!name) continue; let b=0; if(bal!=null){ let v=parseFloat(bal); if(!isNaN(v)) b=v; } emps.push({code:code,name:String(name).trim(),dept:String(dept||'').trim(),type:String(type||'مقيم').trim(),hire:'',balance:b,history:[]}); } }); employees=emps; hasData=true; document.getElementById('uploadStatus').innerHTML=`<div class="alert alert-green">✅ ${emps.length} موظف جاهز - 1017=${emps.find(e=>e.code==1017)?.balance} - دوس رفع</div>`; }
function handleExcel(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(evt){ let d=new Uint8Array(evt.target.result); let wb=XLSX.read(d,{type:'array'}); parseWorkbook(wb); }; r.readAsArrayBuffer(f); }
async function loadFromGitHub(){ let {user,repo}=getGH(); if(!user||!repo) return; document.getElementById('dataStatus').innerHTML='<div class="alert alert-blue">⏳ تحميل من GitHub...</div>'; try{ let res=await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/data.json?${Date.now()}`,{cache:'no-store'}); let txt=await res.text(); if(!res.ok||!txt||txt.trim()=='[]'||txt.trim()==''){ document.getElementById('dataStatus').innerHTML='<div class="alert alert-red">السحابة فاضية - ارفع الشيت</div>'; return; } let data=JSON.parse(txt); employees=Array.isArray(data)?data:[]; hasData=employees.length>0; if(hasData){ document.getElementById('dataStatus').innerHTML=`<div class="alert alert-green">✅ ${employees.length} موظف من GitHub - 1017=${employees.find(e=>e.code==1017)?.balance||0} مظبوط عند الكل</div>`; } }catch(e){ document.getElementById('dataStatus').innerHTML='<div class="alert alert-red">فاضي - ارفع الشيت</div>'; } }
async function uploadToGitHub(){ if(!hasData){alert('اختر الشيت');return;} let {user,repo,token}=getGH(); if(!token){alert('حط التوكن');return;} document.getElementById('uploadStatus').innerHTML='<div class="alert alert-blue">⏳ بيرفع على GitHub...</div>'; try{ let getRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`}}); let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; } let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees)))); let putRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`تحديث ${new Date().toISOString()} 1017=${employees.find(e=>e.code==1017)?.balance}`,content:content,sha:sha})}); let txt=await putRes.text(); if(putRes.ok){ document.getElementById('uploadStatus').innerHTML=`<div class="alert alert-green">✅ اترفع! استنى دقيقة والكل هيشوف 1017=4 مظبوط - جرب من موبايل تاني</div>`; setTimeout(loadFromGitHub,3000); } else { document.getElementById('uploadStatus').innerHTML=`<div class="alert alert-red">❌ ${txt}</div>`; } }catch(e){ document.getElementById('uploadStatus').innerHTML=`<div class="alert alert-red">❌ ${e.message}</div>`; } }
async function saveToGitHub(){ let {user,repo,token}=getGH(); if(!token) return; try{ let getRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`}}); let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; } let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees)))); await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`تعديل ${new Date().toISOString()}`,content:content,sha:sha})}); }catch(e){} }
async function editBalance(){ let c=document.getElementById('adjCode').value.trim(); let a=parseFloat(document.getElementById('adjAmount').value); if(!c||isNaN(a)) return; let emp=employees.find(e=>String(e.code)===c); if(!emp) return; emp.balance+=a; if(emp.balance<0) emp.balance=0; await saveToGitHub(); alert(`تم - ${emp.name} = ${emp.balance} عند الكل بعد دقيقة`); }
async function addLeave(){ let c=document.getElementById('leaveCode').value.trim(); let d=parseFloat(document.getElementById('leaveDays').value); if(!c||isNaN(d)) return; let emp=employees.find(e=>String(e.code)===c); if(!emp) return; emp.balance-=d; if(emp.balance<0) emp.balance=0; await saveToGitHub(); alert(`خصم ${d} من ${emp.name} - الجديد ${emp.balance}`); }
async function applyMonthlyIncrease(){ if(!confirm('زيادة يوم 26؟')) return; for(let emp of employees){ if(String(emp.type).includes('مغترب')){ emp.balance+=5; } } await saveToGitHub(); alert('تمت الزيادة'); }
function searchByCode(){ let c=document.getElementById('empCodeOnly').value.trim(); let emp=employees.find(e=>String(e.code)===c); document.getElementById('empResult').innerHTML=emp?`<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center"><b>${emp.code} - ${emp.name}</b><div class="balance-big">${emp.balance.toFixed(1)}</div><div>من GitHub - نفس الرقم عند الكل</div></div>`:'❌ غير موجود - ارفع الشيت الأول'; }
setTimeout(()=>{ let u=localStorage.getItem('gh_user'); let r=localStorage.getItem('gh_repo'); let t=localStorage.getItem('gh_token'); if(u) document.getElementById('ghUser').value=u; if(r) document.getElementById('ghRepo').value=r; if(t) document.getElementById('ghToken').value=t; loadFromGitHub(); },800);
</script></body></html>
