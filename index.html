<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام رصيد الإجازات - آمن بالكود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
*{font-family:Cairo,sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff}
.header{background:linear-gradient(135deg,#0f172a,#4f46e5);padding:18px;text-align:center;border-bottom:3px solid #10b981}
.card{background:#1e293b;margin:12px;padding:16px;border-radius:14px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:6px 0}
button{padding:12px 18px;border-radius:10px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px}
.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}.btn-red{background:#ef4444}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#0f172a;border-radius:10px;overflow:hidden}
th,td{padding:8px;border:1px solid #334155;text-align:center;font-size:12px}
th{background:#334155}
.balance-big{font-size:48px;font-weight:900;color:#10b981;text-align:center}
.search-box{background:linear-gradient(135deg,#1e293b,#0f172a);padding:22px;border-radius:16px;margin:15px;border:2px solid #10b981}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px}
.tab{padding:10px 18px;background:#334155;border-radius:22px;cursor:pointer}
.tab.active{background:#10b981;color:#000}
.alert{padding:10px;border-radius:8px;margin:8px 0;font-size:12px}
.alert-green{background:#065f46;border:1px solid #10b981}
.alert-red{background:#7f1d1d;border:1px solid #ef4444}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🏭 نظام رصيد الإجازات - آمن</h2>
<p style="margin:5px 0 0 0;font-size:11px;color:#94a3b8">بحث بالكود فقط + تعديل رصيد فوري لتحويل الإضافي</p>
</div>
<div class="tabs">
<div class="tab active" id="btnEmp" onclick="switchTab('emp')">👤 دخول الموظف</div>
<div class="tab" id="btnAdmin" onclick="switchTab('admin')">🔐 الإدارة</div>
</div>
<div id="tab-emp">
<div class="search-box">
<h3 style="margin-top:0;text-align:center">👤 استعلام عن رصيدك</h3>
<p style="text-align:center;font-size:12px;color:#94a3b8">ادخل كودك فقط</p>
<input id="empCodeOnly" type="tel" placeholder="101" style="text-align:center;font-size:22px;letter-spacing:3px">
<button onclick="searchByCode()" style="width:100%;font-size:16px;margin-top:10px">🔍 عرض رصيدي</button>
</div>
<div id="empResult"></div>
</div>
<div id="tab-admin" style="display:none">
<div class="card">
<h3>🔐 دخول الإدارة (admin123)</h3>
<input id="adminPass" type="password" placeholder="كلمة سر الإدارة">
<button class="btn-blue" onclick="loginAdmin()">دخول</button>
<div id="adminContent" style="display:none">
<hr style="border-color:#334155;margin:15px 0">
<h3>⚙️ تعديل رصيد (تحويل إضافي لرصيد)</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<input id="adjCode" placeholder="كود الموظف">
<input id="adjAmount" type="number" step="0.5" placeholder="+2 أو -1">
</div>
<input id="adjReason" placeholder="السبب: تحويل 8 ساعات إضافي = 1 يوم">
<button class="btn-orange" onclick="adjustBalance()" style="width:100%">✅ تطبيق فورا</button>
<div id="adjHistory"></div>
<hr style="border-color:#334155;margin:15px 0">
<h3>📋 كل الموظفين (166)</h3>
<input id="adminSearch" placeholder="بحث إداري..." oninput="renderAdmin()" style="width:100%">
<div id="adminList"></div>
<button class="btn-blue" onclick="exportAll()">📤 تصدير CSV</button>
</div>
</div>
</div>

let adjustments = JSON.parse(localStorage.getItem('egazat_adjustments')||'{}');
function getBaseBalance(emp){
  let months=['12-2025','1-2026','2-2026','3-2026','4-2026','5-2026','6-2026','7-2026','8-2026','9-2026','10-2026','11-2026'];
  for(let m=months.length-1;m>=0;m--){ if(emp.balances[months[m]]!==undefined) return emp.balances[months[m]]; }
  return 0;
}
function getFinalBalance(emp){
  let base=getBaseBalance(emp);
  let adjList=adjustments[String(emp.code)]||[];
  let adjSum=adjList.reduce((s,a)=>s+parseFloat(a.amount||0),0);
  return base+adjSum;
}
function switchTab(t){
 document.getElementById('tab-emp').style.display=t==='emp'?'block':'none';
 document.getElementById('tab-admin').style.display=t==='admin'?'block':'none';
 document.getElementById('btnEmp').classList.toggle('active', t==='emp');
 document.getElementById('btnAdmin').classList.toggle('active', t==='admin');
 if(t==='admin') renderAdmin();
}
function searchByCode(){
 let code=document.getElementById('empCodeOnly').value.trim();
 let out=document.getElementById('empResult');
 if(!code){ out.innerHTML='<div class="alert alert-red">اكتب الكود</div>'; return; }
 let emp=employees.find(e=>String(e.code)===String(code));
 if(!emp){ out.innerHTML='<div class="alert alert-red">❌ الكود غير موجود</div>'; return; }
 let base=getBaseBalance(emp);
 let adjList=adjustments[String(emp.code)]||[];
 let adjSum=adjList.reduce((s,a)=>s+parseFloat(a.amount||0),0);
 let finalBal=base+adjSum;
 let totalLeaves=0; for(let k in emp.leaves_count) totalLeaves+=emp.leaves_count[k];
 let hire=new Date(emp.hire); let ent=new Date(hire); ent.setDate(ent.getDate()+180);
 let adjHtml='';
 if(adjList.length>0){
   adjHtml='<table><tr><th>التاريخ</th><th>التعديل</th><th>السبب</th></tr>';
   adjList.slice(-5).reverse().forEach(a=>{ adjHtml+=`<tr><td>${a.date}</td><td style="color:${a.amount>0?'#10b981':'#ef4444'}">${a.amount>0?'+':''}${a.amount}</td><td>${a.reason}</td></tr>`; });
   adjHtml+='</table>';
 } else { adjHtml='<p style="font-size:11px;color:#64748b">لا يوجد تحويل إضافي</p>'; }
 out.innerHTML=`
 <div class="card" style="border:2px solid #10b981">
 <div style="text-align:center"><b style="font-size:20px">${emp.code} - ${emp.name}</b><br><small style="color:#94a3b8">${emp.dept} | تعيين: ${emp.hire} | استحقاق: ${ent.toISOString().slice(0,10)}</small></div>
 <div class="balance-big">${finalBal.toFixed(1)}</div>
 <div style="text-align:center;font-size:13px;color:#94a3b8">يوم متبقي (الأساسي ${base} + تعديلات ${adjSum})</div>
 <div class="alert alert-green" style="margin-top:12px"><b>تفاصيل:</b><br>الأساسي: ${base} يوم<br>تعديل إضافي: ${adjSum} يوم<br>غياب مسجل: ${totalLeaves} يوم</div>
 <h4>سجل التعديلات:</h4>${adjHtml}
 <h4 style="margin-top:15px">سجل الشهور:</h4>
 <table><tr><th>الشهر</th><th>الرصيد</th><th>غياب</th></tr>${Object.keys(emp.balances).map(m=>`<tr><td>${m}</td><td>${emp.balances[m]}</td><td>${emp.leaves_count[m]||0}</td></tr>`).join('')}</table>
 </div>`;
}
function loginAdmin(){
 let p=document.getElementById('adminPass').value;
 if(p!=='admin123' && p!=='123'){ alert('كلمة السر admin123'); return; }
 document.getElementById('adminContent').style.display='block';
 renderAdmin();
}
function adjustBalance(){
 let code=document.getElementById('adjCode').value.trim();
 let amount=parseFloat(document.getElementById('adjAmount').value);
 let reason=document.getElementById('adjReason').value.trim()||'تحويل إضافي';
 if(!code||isNaN(amount)){ alert('اكتب الكود والمبلغ'); return; }
 let emp=employees.find(e=>String(e.code)===String(code));
 if(!emp){ alert('الكود غير موجود'); return; }
 if(!adjustments[code]) adjustments[code]=[];
 adjustments[code].push({amount:amount, reason:reason, date:new Date().toISOString().slice(0,10)});
 localStorage.setItem('egazat_adjustments', JSON.stringify(adjustments));
 alert(`✅ تم ${amount>0?'إضافة':'خصم'} ${amount} يوم للموظف ${emp.name}\nالرصيد الجديد: ${getFinalBalance(emp).toFixed(1)}`);
 document.getElementById('adjAmount').value=''; document.getElementById('adjReason').value='';
 renderAdmin(); renderAdjHistory();
}
function renderAdjHistory(){
 let code=document.getElementById('adjCode').value.trim();
 let div=document.getElementById('adjHistory');
 if(!code||!adjustments[code]){ div.innerHTML=''; return; }
 let list=adjustments[code];
 let html='<div class="alert alert-green">آخر تعديلات:<br>';
 list.slice(-3).forEach(a=> html+=`${a.date}: ${a.amount} - ${a.reason}<br>`);
 html+='</div>'; div.innerHTML=html;
}
function renderAdmin(){
 let q=(document.getElementById('adminSearch').value||'').toLowerCase();
 let listDiv=document.getElementById('adminList');
 let filtered=employees.filter(e=> !q || String(e.code).includes(q) || e.name.toLowerCase().includes(q));
 let html=`<table><tr><th>الكود</th><th>الاسم</th><th>أساسي</th><th>تعديل</th><th>نهائي</th></tr>`;
 filtered.slice(0,80).forEach(emp=>{
   let base=getBaseBalance(emp);
   let adjSum=(adjustments[String(emp.code)]||[]).reduce((s,a)=>s+parseFloat(a.amount||0),0);
   let finalBal=base+adjSum;
   html+=`<tr><td>${emp.code}</td><td style="text-align:right;font-size:11px">${emp.name}</td><td>${base}</td><td style="color:${adjSum>=0?'#10b981':'#ef4444'}">${adjSum>0?'+':''}${adjSum}</td><td style="font-weight:900;background:${finalBal<5?'#7f1d1d':'#065f46'}">${finalBal.toFixed(1)}</td></tr>`;
 });
 html+=`</table>`;
 listDiv.innerHTML=html;
}
function exportAll(){
 let csv="\uFEFFالكود,الاسم,الإدارة,تاريخ التعيين,الرصيد الأساسي,تعديل إضافي,الرصيد النهائي,غياب\n";
 employees.forEach(e=>{
   let base=getBaseBalance(e);
   let adjSum=(adjustments[String(e.code)]||[]).reduce((s,a)=>s+parseFloat(a.amount||0),0);
   let finalBal=base+adjSum;
   let total=0; for(let k in e.leaves_count) total+=e.leaves_count[k];
   csv+=`${e.code},"${e.name}","${e.dept}",${e.hire},${base},${adjSum},${finalBal},${total}\n`;
 });
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='رصيد_الاجازات_بالاضافي.csv'; a.click();
}
