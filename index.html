<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إدارة رصيد الإجازات - البروي - العبور</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{font-family:Cairo,sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}.card{background:#1e293b;margin:10px;padding:14px;border-radius:12px;border:1px solid #334155}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff;margin:5px 0}button{padding:11px;border-radius:9px;border:none;background:#10b981;color:#fff;font-weight:800;cursor:pointer;margin:4px 0;width:100%}.btn-blue{background:#6366f1}.btn-orange{background:#f59e0b;color:#000}.btn-red{background:#ef4444}.btn-green{background:#10b981}.btn-gray{background:#334155}.alert-green{background:#065f46;border:1px solid #10b981;padding:9px;border-radius:9px;margin:7px 0;font-size:12px}.alert-blue{background:#1e3a8a;border:1px solid #6366f1;padding:9px;border-radius:9px;margin:7px 0;font-size:12px}.history-item{background:#0f172a;border:1px solid #334155;padding:8px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px}.tenure-box{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #f59e0b;padding:10px;border-radius:10px;margin-top:10px;text-align:right}</style></head><body>
<div style="background:linear-gradient(135deg,#0f172a,#4f46e5);padding:16px;text-align:center;border-bottom:3px solid #10b981"><h3 style="margin:0">🏭 إدارة رصيد الإجازات</h3><small>شركة البروي لصناعة الغازات - مصنع العبور</small></div>
<div style="padding:10px">
<div class="card" style="text-align:center;border:2px solid #10b981"><input id="empCodeOnly" type="tel" placeholder="اكتب كودك" style="text-align:center;font-size:22px;font-weight:900"><button onclick="searchByCode()">🔍 عرض رصيدي وسجلي ومدة خدمتي</button><div id="empResult"></div></div>
<div class="card" id="dataStatus"></div>
<div class="card"><b>🔐 إدارة</b><input id="adminPass" type="password" placeholder="••••••••"><button class="btn-blue" onclick="login()">دخول</button>
<div id="configArea" style="display:none;background:#0f172a;padding:10px;border-radius:10px;margin-top:10px;border:1px dashed #334155"><small>إعداد أول مرة</small><input id="ghToken" type="password" placeholder="••••••••"><button class="btn-blue" onclick="saveToken()">💾 حفظ وإخفاء</button><div id="tokenStatus"></div></div>
<div id="adminArea" style="display:none;margin-top:10px">
<div class="card" style="background:#0f172a;border:2px dashed #10b981;margin:0 0 10px 0"><b>📂 رفع الشيت</b><input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcel(event)"><button class="btn-blue" onclick="document.getElementById('excelFile').click()">اختر الشيت</button><button class="btn-green" onclick="uploadToGitHub()">☁️ رفع على GitHub</button><div id="uploadStatus"></div></div>
<div class="card" style="background:#0f172a;border:2px solid #f59e0b;margin:0 0 10px 0"><b>⚙️ زيادات وتصفية</b><button class="btn-orange" onclick="applyMonthlyIncrease()">⚡ زيادة يوم 26 - 5 للمغترب / 6 لو 10 سنين حتى شهر 9</button><button onclick="applyAnnualReset()" style="background:linear-gradient(135deg,#ef4444,#f59e0b)">📅 تصفية 26 ديسمبر - للمقيمين: تصدير فلوس + جديد 21 أو 30 - مغتربين رصيد قديم بيفضل</button><div id="annualResult"></div></div>
<div class="card" style="background:#0f172a;border:2px solid #10b981;margin:0 0 10px 0"><b>➕ تحويل إضافي / تعديل رصيد</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="adjCode" placeholder="كود: 1017"><input id="adjAmount" type="number" step="0.5" placeholder="+2 أو -1"></div><input id="adjReason" placeholder="السبب: تحويل إضافي"><button class="btn-green" onclick="editBalance()">✅ زود / نقص الرصيد</button></div>
<div class="card" style="background:#0f172a;border:2px solid #ef4444;margin:0"><b>➖ خصم إجازة - بالتاريخ</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="leaveCode" placeholder="كود: 1017"><input id="leaveFrom" type="date"><input id="leaveTo" type="date"><input id="leaveDays" type="number" step="0.5" placeholder="عدد الأيام"></div><button class="btn-red" onclick="addLeave()">➖ خصم الإجازة</button><div id="leaveResult"></div></div>
<div class="card" style="margin:10px 0 0 0"><input id="adminSearch" placeholder="بحث بالكود - هيظهر سجله" oninput="renderAdmin()"><div id="adminList"></div><div id="historyView"></div></div>
</div></div>
</div>
<script>
let employees=[],hasData=false;
function getGH(){ return {user:'ahmedsemba', repo:'egazat-system', token:localStorage.getItem('gh_token')||''} }
function saveToken(){ let t=document.getElementById('ghToken').value.trim(); if(!t){alert('حط التوكن');return;} localStorage.setItem('gh_token',t); document.getElementById('tokenStatus').innerHTML='<div class="alert-green">✅ اتحفظ</div>'; setTimeout(()=>{ document.getElementById('configArea').style.display='none'; },800); }
function login(){ let p=document.getElementById('adminPass').value; const K=[65,104,109,101,100,64,115,97,108,119,97,50,48,50,48]; let ok=p.length===K.length; if(ok) for(let i=0;i<K.length;i++) if(p.charCodeAt(i)!==K[i]) ok=false; if(!ok){alert('الباسورد غلط');return;} let hasToken=localStorage.getItem('gh_token'); if(!hasToken){ document.getElementById('configArea').style.display='block'; document.getElementById('adminArea').style.display='none'; return; } document.getElementById('configArea').style.display='none'; document.getElementById('adminArea').style.display='block'; loadFromGitHub(); }
function getTenureYears(h){ if(!h) return 0; try{ let d=new Date(h); if(isNaN(d)) return 0; return (new Date()-d)/(1000*60*60*24*365.25);}catch(e){return 0;} }
function formatTenure(hireStr){
 if(!hireStr) return {text:'تاريخ التعيين مش متسجل', years:0, months:0, remaining:''};
 try{
   let hire=new Date(hireStr);
   if(isNaN(hire)) return {text:'تاريخ التعيين مش متسجل', years:0, months:0, remaining:''};
   let now=new Date();
   let diffMs=now-hire;
   let totalDays=Math.floor(diffMs/(1000*60*60*24));
   let years=Math.floor(totalDays/365.25);
   let months=Math.floor((totalDays%365.25)/30.44);
   let remainingYears=10-years;
   let remainingText='';
   if(years>=10){ remainingText=`✅ كملت 10 سنين - ليك 30 يوم إجازة سنوية`; }
   else {
     let targetDate=new Date(hire);
     targetDate.setFullYear(hire.getFullYear()+10);
     let remMs=targetDate-now;
     let remDays=Math.ceil(remMs/(1000*60*60*24));
     let remMonths=Math.floor(remDays/30.44);
     let remY=Math.floor(remMonths/12);
     let remM=remMonths%12;
     remainingText=`⏳ فاضلك ${remY>0?remY+' سنة و ':''}${remM} شهر وتكمل 10 سنين - هتاخد 30 يوم بدل 21 يوم - هتكمل في ${targetDate.toLocaleDateString('ar-EG')}`;
   }
   return {text:`📅 متعين من ${hire.toLocaleDateString('ar-EG')} - بقالك ${years} سنة و ${months} شهر`, years:years, months:months, remaining:remainingText, hireDate:hire.toLocaleDateString('ar-EG')};
 }catch(e){ return {text:'تاريخ التعيين مش متسجل', years:0, months:0, remaining:''}; }
}
function parseWorkbook(wb){ let emps=[]; wb.SheetNames.forEach(sn=>{ let ws=wb.Sheets[sn]; let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}); for(let r=1;r<rows.length;r++){ let row=rows[r]; if(!row||row[0]==null) continue; let code=parseInt(row[0]); if(isNaN(code)) continue; let name=row[1], dept=row[2], type=row[3], hire=row[4], bal=row[5]; if(!name) continue; let b=0; if(bal!=null){ let v=parseFloat(bal); if(!isNaN(v)) b=v; } let hd=null; if(hire instanceof Date) hd=hire; else if(typeof hire==='number'){ hd=new Date((hire-25569)*86400*1000); } else if(hire){ let s=String(hire); let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m){ hd=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1])); } else { hd=new Date(s); } } let hireStr=hd&&!isNaN(hd)?hd.toISOString().slice(0,10):''; emps.push({code:code,name:String(name).trim(),dept:String(dept||'').trim(),type:String(type||'مقيم').trim(),hire:hireStr,balance:b,history:[]}); } }); employees=emps; hasData=true; document.getElementById('uploadStatus').innerHTML=`<div class="alert-green">✅ ${emps.length} جاهز</div>`; }
function handleExcel(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(evt){ let d=new Uint8Array(evt.target.result); let wb=XLSX.read(d,{type:'array'}); parseWorkbook(wb); }; r.readAsArrayBuffer(f); }
async function loadFromGitHub(){ let {user,repo}=getGH(); document.getElementById('dataStatus').innerHTML='<div class="alert-blue">⏳ تحميل...</div>'; try{ let res=await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/data.json?${Date.now()}`,{cache:'no-store'}); let txt=await res.text(); if(!res.ok||!txt||txt.trim()=='[]'||txt.trim()=='' ){ document.getElementById('dataStatus').innerHTML='<div class="alert-blue">السحابة فاضية</div>'; return; } let data=JSON.parse(txt); employees=Array.isArray(data)?data:[]; hasData=employees.length>0; if(hasData){ document.getElementById('dataStatus').innerHTML=`<div class="alert-green">✅ ${employees.length} محمل</div>`; renderAdmin(); } }catch(e){} }
async function uploadToGitHub(){ if(!hasData){alert('اختر الشيت');return;} let {user,repo,token}=getGH(); if(!token){alert('حط التوكن');return;} document.getElementById('uploadStatus').innerHTML='<div class="alert-blue">⏳ بيرفع...</div>'; try{ let getRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`}}); let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; } let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees)))); let putRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`رفع شيت`,content:content,sha:sha})}); if(putRes.ok){ document.getElementById('uploadStatus').innerHTML=`<div class="alert-green">✅ اترفع!</div>`; setTimeout(loadFromGitHub,2000); } }catch(e){} }
async function saveToGitHub(){ let {user,repo,token}=getGH(); if(!token) return; try{ let getRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{headers:{'Authorization':`token ${token}`}}); let sha=null; if(getRes.ok){ let j=await getRes.json(); sha=j.sha; } let content=btoa(unescape(encodeURIComponent(JSON.stringify(employees)))); await fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`تعديل`,content:content,sha:sha})}); }catch(e){} }
async function editBalance(){ let code=document.getElementById('adjCode').value.trim(); let amount=parseFloat(document.getElementById('adjAmount').value); let reason=document.getElementById('adjReason').value||'تحويل إضافي'; if(!code||isNaN(amount)){alert('اكتب الكود والمبلغ');return;} let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){alert('الكود غير موجود');return;} emp.balance+=amount; if(emp.balance<0) emp.balance=0; emp.history=emp.history||[]; emp.history.push({id:Date.now(), date:new Date().toISOString().slice(0,10), amount:amount, reason:reason, from:'', to:''}); await saveToGitHub(); alert(`✅ ${emp.name} الجديد ${emp.balance}`); renderAdmin(); showHistory(emp.code); }
document.getElementById('leaveFrom').addEventListener('change',calcDays); document.getElementById('leaveTo').addEventListener('change',calcDays);
function calcDays(){ let f=document.getElementById('leaveFrom').value; let t=document.getElementById('leaveTo').value; if(f&&t){ let d1=new Date(f); let d2=new Date(t); let diff=Math.round((d2-d1)/(1000*60*60*24))+1; if(diff>0) document.getElementById('leaveDays').value=diff; } }
async function addLeave(){ let code=document.getElementById('leaveCode').value.trim(); let from=document.getElementById('leaveFrom').value; let to=document.getElementById('leaveTo').value; let days=parseFloat(document.getElementById('leaveDays').value); if(!code||isNaN(days)){alert('اكتب الكود والأيام');return;} let emp=employees.find(e=>String(e.code)===String(code)); if(!emp){alert('غير موجود');return;} emp.balance-=days; if(emp.balance<0) emp.balance=0; emp.history=emp.history||[]; emp.history.push({id:Date.now(), date:new Date().toISOString().slice(0,10), amount:-days, reason:`إجازة ${days} يوم`, from:from||'', to:to||''}); await saveToGitHub(); document.getElementById('leaveResult').innerHTML=`<div class="alert-green">✅ خصم ${days} من ${emp.name}</div>`; renderAdmin(); showHistory(emp.code); }
async function deleteHistory(empCode, histId){ if(!confirm('هتمسح الحركة وترجع الرصيد؟')) return; let emp=employees.find(e=>String(e.code)===String(empCode)); if(!emp) return; let h=emp.history.find(x=>x.id===histId); if(!h) return; emp.balance-=h.amount; if(emp.balance<0) emp.balance=0; emp.history=emp.history.filter(x=>x.id!==histId); await saveToGitHub(); alert(`✅ اتمسحت - ${emp.name} رصيده ${emp.balance.toFixed(1)}`); renderAdmin(); showHistory(emp.code); }
function showHistory(code){ let emp=employees.find(e=>String(e.code)===String(code)); if(!emp||!emp.history||emp.history.length===0){ document.getElementById('historyView').innerHTML=`<div class="alert-blue">مفيش سجل لـ ${code}</div>`; return; } let html=`<div class="card" style="background:#0f172a;margin:10px 0"><b>📜 سجل ${emp.code} - ${emp.name} - الرصيد ${emp.balance.toFixed(1)}</b>`; [...emp.history].reverse().forEach(h=>{ let color=h.amount>0?'#10b981':'#ef4444'; html+=`<div class="history-item"><div><span style="color:${color};font-weight:900">${h.amount>0?'+':''}${h.amount}</span> - ${h.reason}<br><small>${h.date} ${h.from?`من ${h.from} لـ ${h.to}`:''}</small></div><button class="btn-gray" style="width:auto;padding:5px 10px;font-size:10px" onclick="deleteHistory('${emp.code}',${h.id})">🗑️ مسح</button></div>`; }); html+=`</div>`; document.getElementById('historyView').innerHTML=html; }
function searchByCode(){
 let c=document.getElementById('empCodeOnly').value.trim();
 let emp=employees.find(e=>String(e.code)===c);
 if(!emp){ document.getElementById('empResult').innerHTML='❌ غير موجود'; return; }
 let currentYear=new Date().getFullYear().toString();
 let yearHistory=(emp.history||[]).filter(h=>String(h.date).startsWith(currentYear) && h.amount<0);
 let takenThisYear=0; yearHistory.forEach(h=>{ takenThisYear+=Math.abs(h.amount); });
 let tenure=formatTenure(emp.hire);
 let histHtml='';
 if(yearHistory.length>0){
   histHtml='<div style="background:#0f172a;margin-top:10px;padding:10px;border-radius:10px;text-align:right">';
   histHtml+=`<b style="color:#f59e0b">📅 إجازاتك في ${currentYear}: واخد ${takenThisYear} يوم</b><br>`;
   [...yearHistory].reverse().forEach(h=>{ histHtml+=`<div style="font-size:11px;padding:3px 0;border-bottom:1px solid #1e293b">🗓️ ${h.date} - ${Math.abs(h.amount)} يوم ${h.from?`من ${h.from} لـ ${h.to}`:''}</div>`; });
   histHtml+='</div>';
 }
 let tenureHtml=`<div class="tenure-box"><b style="color:#f59e0b">⏰ مدة خدمتك</b><br>${tenure.text}<br><small style="color:#10b981">${tenure.remaining}</small></div>`;
 document.getElementById('empResult').innerHTML=`<div style="background:#065f46;padding:12px;border-radius:10px;text-align:center"><b>${emp.code} - ${emp.name}</b><div style="font-size:44px;font-weight:900;color:#10b981">${emp.balance.toFixed(1)}</div><div style="font-size:12px">الرصيد المتبقي</div><div style="background:#1e293b;margin-top:8px;padding:8px;border-radius:8px;font-size:13px;color:#fbbf24">واخد ${takenThisYear} يوم في ${currentYear}</div>${tenureHtml}${histHtml}</div>`;
}
async function applyMonthlyIncrease(){ if(!confirm('هتزود 5 للمغترب و 6 لو كمل 10 سنين حتى شهر 9؟')) return; for(let emp of employees){ let tenure=getTenureYears(emp.hire); let month=new Date().getMonth()+1; let isMog=String(emp.type).includes('مغترب'); let add=0; if(isMog){ add=5; if(tenure>=10&&month>=1&&month<=9) add=6; } else { if(tenure>=10&&month>=1&&month<=9) add=1; } if(add>0){ emp.balance+=add; emp.history=emp.history||[]; emp.history.push({id:Date.now()+Math.random(), date:new Date().toISOString().slice(0,10), amount:add, reason:`زيادة شهرية يوم 26 - ${add}`}); } } await saveToGitHub(); alert('✅ تمت الزيادة'); renderAdmin(); }
async function applyAnnualReset(){
 if(!confirm('تصفية 26 ديسمبر - هتصدر شيت المقيمين فلوس وتحط الجديد؟')) return;
 let payoutList=[];
 for(let emp of employees){ let isMog=String(emp.type).toLowerCase().includes('مغترب'); if(!isMog){ if(emp.balance>0){ payoutList.push({الكود:emp.code, الاسم:emp.name, القسم:emp.dept, تاريخ_التعيين:emp.hire, مدة_الخدمة:parseFloat(getTenureYears(emp.hire).toFixed(1)), الرصيد_القديم_للصرف_فلوس:emp.balance, الرصيد_الجديد: getTenureYears(emp.hire)>=10?30:21}); } } }
 if(payoutList.length>0){ let ws=XLSX.utils.json_to_sheet(payoutList); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"تصفية"); XLSX.writeFile(wb,`تصفية_مقيمين_26_ديسمبر_${new Date().toISOString().slice(0,10)}.xlsx`); }
 for(let emp of employees){ let isMog=String(emp.type).toLowerCase().includes('مغترب'); if(!isMog){ let tenure=getTenureYears(emp.hire); let newAnnual=tenure>=10?30:21; let old=emp.balance; emp.balance=newAnnual; emp.history.push({id:Date.now()+Math.random(), date:new Date().toISOString().slice(0,10), amount:newAnnual-old, reason:`تصفية سنوية 26 ديسمبر - كان ${old} للصرف - بقى ${newAnnual}`}); } }
 await saveToGitHub(); document.getElementById('annualResult').innerHTML=`<div class="alert-green">✅ تم - صدر ${payoutList.length} مقيم فلوس</div>`; renderAdmin();
}
function renderAdmin(){ if(!hasData){document.getElementById('adminList').innerHTML='فاضي';return;} let q=(document.getElementById('adminSearch').value||'').toLowerCase(); let filtered=employees.filter(e=>!q||String(e.code).includes(q)||e.name.toLowerCase().includes(q)); let html=`<table style="width:100%;border-collapse:collapse;background:#0f172a"><tr><th style="padding:6px;border:1px solid #334155">كود</th><th style="padding:6px;border:1px solid #334155">اسم</th><th style="padding:6px;border:1px solid #334155">رصيد</th><th style="padding:6px;border:1px solid #334155">خدمة</th><th style="padding:6px;border:1px solid #334155">سجل</th></tr>`; filtered.slice(0,200).forEach(emp=>{ let t=getTenureYears(emp.hire); html+=`<tr><td style="padding:6px;border:1px solid #334155">${emp.code}</td><td style="padding:6px;border:1px solid #334155;font-size:9px">${emp.name.slice(0,18)}</td><td style="padding:6px;border:1px solid #334155;background:#065f46;font-weight:900">${emp.balance.toFixed(1)}</td><td style="padding:6px;border:1px solid #334155;font-size:8px">${t.toFixed(1)} سنة</td><td style="padding:6px;border:1px solid #334155"><button style="width:auto;padding:4px 8px;font-size:9px" class="btn-blue" onclick="showHistory('${emp.code}')">📜</button></td></tr>`; }); html+=`</table>`; document.getElementById('adminList').innerHTML=html; }
setTimeout(loadFromGitHub,800);
</script></body></html>
